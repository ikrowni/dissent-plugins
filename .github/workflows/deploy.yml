name: Deploy to plugins.dissent.chat

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `actions: read` is what lets the re-bless step below find the last SUCCESSFUL
    # deploy to diff from. Without it that lookup fails and the step falls back to the
    # previous push, which is the behaviour that let dnd-hub ship unblessed.
    permissions:
      contents: read
      actions: read
    steps:
      # ⚠️ FULL HISTORY. The re-bless step diffs this push against its predecessor
      # to work out which plugin directories changed; the default shallow clone
      # has no predecessor and the diff fails.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Until 2026-08-07 this repo had no runner, so rl-hub's four test files had
      # never executed. Deploys gate on them now.
      - name: Unit tests
        run: npm ci && npm test

      - name: Validate all manifests
        run: |
          errors=0
          for f in plugins/*/manifest.json; do
            python3 -m json.tool "$f" > /dev/null 2>&1 || { echo "Invalid JSON: $f"; errors=$((errors+1)); }
          done
          if [ $errors -gt 0 ]; then
            echo "$errors manifest(s) failed validation"
            exit 1
          fi
          echo "All manifests valid"

      # Fails when a manifest names a server module that is missing or whose bytes
      # do not match the declared sha256 — a broken publish the node would refuse.
      # Warns when a module is built but unreferenced, i.e. not yet signed and
      # promoted: that is the exact state that shipped nfl-hub 2.32.0's client
      # against 2.31.0's module, where the missing op failed silently into an
      # empty state and was found days later.
      - name: Check server modules match their manifests
        run: node scripts/check-server-modules.mjs

      # ⚠️ THESE THREE GUARD MIRRORING, AND ALL THREE FAIL SILENTLY WITHOUT CI.
      # Each one describes a plugin that works perfectly on THIS host and breaks on
      # every other node — so no amount of testing against plugins.dissent.chat
      # would ever show it. That is precisely how five plugins ended up unmirrorable
      # and unnoticed until 2026-08-15.

      # A resource that is not declared is a resource a mirror cannot enumerate, so
      # the plugin copies its entry file and keeps loading everything else from us.
      # The script has had a --check mode for this from the start; it was never wired
      # in, which meant a plugin could ship files its own manifest did not mention.
      - name: Manifests declare what the plugins actually ship
        run: node scripts/declare-resources.mjs --all --check

      # The shared modules at the plugins root are the SOURCE; each consumer imports a
      # generated copy under its own directory. This is what keeps "one source of
      # truth" true — polymarket.js in particular is the single choke point between a
      # config setting and a real-money order, and a drifted copy answers differently.
      - name: Vendored shared modules match their source
        run: node scripts/vendor-shared.mjs --check

      # Any import reaching above a plugin's own directory can never be mirrored
      # (internal/pluginmirror.RelPath refuses it), permanently pinning that plugin to
      # whoever published it.
      - name: No unmirrorable imports
        run: node scripts/check-plugin-imports.mjs

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # NOTE: this repo deliberately does NOT ship the SDK. dissent-client is the
      # single source of truth and its `npm run deploy` rsyncs dist/sdk/ to all
      # three served copies, including /var/www/dissent-plugins/sdk. This repo
      # used to carry a committed sdk/ and rsync it to the same path, so whichever
      # pipeline ran last won — and the copy here had been frozen since 2026-05-24,
      # silently reverting the SDK to a build with no imageUrl/mediaUrl/wallet.
      - name: Deploy plugin files
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            plugins/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/dissent-plugins/plugins/

      # ⚠️ WITHOUT THIS STEP A RELEASE TAKES THE PLUGIN OFFLINE.
      #
      # The registry pins a hash of each plugin's manifest and entry file, and a
      # background job re-checks them on a timer. A release changes manifest.json
      # (version, and the server_module block), so every release looks exactly like
      # tampering: the job suspends the plugin, which blocks install and
      # /plugins/fetch and makes channel_info report no plugin — so the channel
      # silently falls back to an ordinary chat area.
      #
      # ⚠️ AND SUSPENSION IS A ONE-WAY DOOR. runVerifyAll selects
      # `WHERE suspended = false`, so once suspended the job never re-checks it and
      # a later correct deploy CANNOT clear it. On 2026-08-11 nfl-hub was found
      # suspended and had been rendering nowhere; the re-bless tool and the wrapper
      # script had existed since 2026-08-09/10 but were never wired in, so it
      # depended on somebody remembering to run them by hand.
      #
      # ⚠️ ONLY THE PLUGINS THIS PUSH CHANGED. Re-blessing the whole registry would
      # turn the verify job into a rubber stamp that happily blesses tampered
      # bytes. This is the publisher confirming the bytes it just published;
      # between deploys nothing re-blesses, so real tampering is still caught.
      # Integrity is not skipped either — the binary re-fetches and re-runs the
      # size caps, manifest parse and resource-hash checks.
      #
      # An id that is not in the registry is a no-op, so a new plugin directory
      # cannot fail the deploy.
      #
      # ⚠️ THIS STEP ALSO RE-MIRRORS. A node that mirrors a plugin serves the bytes
      # it copied until something refreshes them, so re-blessing on its own would
      # publish a release the node never actually serves — and it would look
      # correct from every angle, because the registry row, the stored hashes and
      # the mirrored bytes would all agree with each other about the OLD build.
      # Re-mirroring is folded into the re-bless rather than added as a fourth step
      # here, because a fourth step is one somebody eventually skips. It refreshes
      # only plugins already mirrored, and never starts mirroring anything.
      - name: Re-bless changed plugins in the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ⚠️ THE BASE IS THE LAST SUCCESSFUL DEPLOY, NOT THE PREVIOUS PUSH.
          #
          # The rsync above ships the WHOLE tree, but this step only re-blesses what a
          # diff says changed. Those two disagree the moment a run fails: a push that
          # dies in the checks above still lands its commits on main, so the NEXT push
          # diffs against them and never re-blesses the plugins they touched — whose new
          # bytes the next successful rsync then publishes anyway.
          #
          # That is not hypothetical. On 2026-08-15 a push moving dnd-hub's SRD data
          # failed the resource-declaration gate; the follow-up push fixed two other
          # manifests, so `event.before` covered only those two. dnd-hub's new files went
          # live with the registry still storing the OLD build's hashes — the exact state
          # the verify job suspends a plugin for, and suspension is a one-way door
          # (runVerifyAll selects WHERE suspended = false, so it never re-checks).
          #
          # Diffing from the last SUCCESSFUL run closes it: a failed run leaves the base
          # where it was, so the next successful deploy re-blesses everything the failed
          # one would have. Falls back to event.before if the API cannot answer, which is
          # the old behaviour rather than a silent re-bless of everything.
          BEFORE=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Base: last successful deploy $BEFORE"
          else
            BEFORE="${{ github.event.before }}"
            echo "Base: previous push $BEFORE (no reachable last-successful-deploy sha)"
          fi
          # First push to a branch reports an all-zero "before"; fall back to the
          # previous commit rather than diffing against nothing and re-blessing all.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${{ github.sha }}^"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- plugins/ \
            | awk -F/ '/^plugins\/[^/]+\//{print $2}' | sort -u)
          if [ -z "$CHANGED" ]; then
            echo "No plugin directories changed; nothing to re-bless."
            exit 0
          fi
          echo "Re-blessing: $CHANGED"
          for P in $CHANGED; do
            echo "--- $P ---"
            ssh -i ~/.ssh/id_ed25519 \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "/home/ubuntu/projects/scripts/rehash-plugin.sh '$P'" \
              || { echo "re-bless FAILED for $P — it will be suspended by the verify job"; exit 1; }
          done

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      # ⚠️ THE CANARY MUST BE A PLUGIN THIS REPO STILL SHIPS. It was event-card,
      # which was retired on 2026-08-15 — the rsync --delete above then removes the
      # very file this step fetches, so every future deploy fails at the last step
      # AFTER publishing, and the re-bless it precedes looks fine. Pick a plugin
      # with live installs, and re-point this whenever that plugin is retired.
      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://plugins.dissent.chat/plugins/clips-gallery/plugin.html)
          [ "$STATUS" = "200" ] || { echo "Deployment check failed: HTTP $STATUS"; exit 1; }
          echo "Deployment verified: HTTP $STATUS"
