<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>STS2 Companion</title>
  <!-- No ?v= cache-busters: /plugins/** is served no-store, and a buster on a module script
       makes a second module instance (see nfl-hub/plugin.html). -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/runs.css">
  <link rel="stylesheet" href="styles/insights.css">
  <link rel="stylesheet" href="styles/compact.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <span class="brand">STS2 Companion</span>
      <nav id="sections" aria-label="Sections">
        <button type="button" data-section="wiki" aria-current="true">Wiki</button>
        <button type="button" data-section="deck" aria-current="false">Deck</button>
        <button type="button" data-section="history" aria-current="false">Run History</button>
        <button type="button" data-section="insights" aria-current="false">Insights</button>
      </nav>
    </header>
    <main id="view" aria-live="polite"></main>
    <footer id="credits"></footer>
  </div>
  <script type="module" src="core/app.js"></script>
</body>
</html>
