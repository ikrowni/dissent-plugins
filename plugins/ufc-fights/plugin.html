<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UFC Fights</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ufc-red: #d20a0a;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --text: rgba(255,255,255,0.9);
  --text-dim: rgba(255,255,255,0.45);
  --text-muted: rgba(255,255,255,0.25);
  --corner-red: #e63030;
  --corner-blue: #3060e0;
  --glow: 108,99,255;
  --bright: 168,139,250;
}

html { scroll-behavior: smooth; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: #07070f;
  color: var(--text);
  line-height: 1.4;
  min-height: 100vh;
  zoom: 1.35;
}

/* ── Hero ── */
.hero {
  position: relative;
  width: 100%;
  min-height: 650px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 90% 70% at 50% 0%, rgba(210,10,10,0.45) 0%, transparent 65%),
    radial-gradient(ellipse 50% 80% at 20% 110%, rgba(var(--glow),0.25) 0%, transparent 60%),
    radial-gradient(ellipse 50% 80% at 80% 110%, rgba(48,96,224,0.2) 0%, transparent 60%),
    #07070f;
}
.hero-poster {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center center;
  display: block;
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(7,7,15,0.1) 0%, rgba(7,7,15,0.3) 50%, rgba(7,7,15,0.95) 100%);
}
.hero-content {
  position: relative; z-index: 2;
  text-align: center; padding: 0 16px 22px;
}
.event-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--ufc-red); color: #fff;
  font-size: 9.5px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 4px 12px; border-radius: 3px; margin-bottom: 10px;
}
.event-chip-dot { width: 6px; height: 6px; background: rgba(255,255,255,0.6); border-radius: 50%; }
.event-title {
  font-size: clamp(16px,4vw,26px); font-weight: 900; text-transform: uppercase;
  letter-spacing: 0.04em; line-height: 1.1;
  text-shadow: 0 2px 24px rgba(0,0,0,0.9); margin-bottom: 7px;
}
.event-meta {
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  font-size: 11px; color: var(--text-dim); font-weight: 500;
}
.meta-sep { color: var(--text-muted); }

/* ── Inner ── */
.inner { padding: 16px 14px 40px; max-width: 860px; margin: 0 auto; }

/* ── Tabs ── */
.tabs {
  display: flex; gap: 2px;
  background: rgba(255,255,255,0.05); border-radius: 10px; padding: 3px;
  margin-bottom: 18px;
}
.tab {
  flex: 1; text-align: center; padding: 9px 6px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  border-radius: 8px; color: var(--text-dim); cursor: pointer;
}
.tab.active { background: var(--ufc-red); color: #fff; }

/* ── Countdown ── */
.countdown {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: rgba(210,10,10,0.07);
  border: 1px solid rgba(210,10,10,0.2);
  border-radius: 12px; padding: 14px 20px; margin-bottom: 22px;
}
.cd-unit { text-align: center; min-width: 44px; }
.cd-num { font-size: 30px; font-weight: 900; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; }
.cd-label { font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
.cd-sep { font-size: 22px; font-weight: 900; color: rgba(210,10,10,0.35); align-self: center; margin-bottom: 12px; }

/* ── Section head ── */
.section-head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.section-head::before { content: ''; display: block; width: 3px; height: 16px; background: var(--ufc-red); border-radius: 2px; }
.section-head h3 { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }

/* ── Fight list ── */
.fight-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }

/* ── Fight row ── */
.fight-row {
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 12px; overflow: hidden;
  transition: background 0.12s, border-color 0.12s;
}
.fight-row:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.11); }
.fight-row.expanded { border-color: rgba(210,10,10,0.22); }

/* Collapsed row layout */
.row-collapsed {
  display: grid;
  grid-template-columns: 22px 1fr auto 1fr 68px;
  align-items: center; gap: 8px;
  padding: 9px 12px;
  cursor: pointer;
}
.fight-num {
  font-size: 9px; font-weight: 700; color: var(--text-muted);
  text-align: center; text-transform: uppercase;
}
.row-fighter { display: flex; align-items: center; gap: 8px; }
.row-fighter.right { flex-direction: row-reverse; }

/* Fighter thumbnail — shows bust/upper-body */
.row-thumb {
  width: 40px; height: 50px;
  border-radius: 7px; overflow: hidden; flex-shrink: 0;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
}
.row-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.mini-sil-wrap { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.mini-sil {
  width: 78%; height: 88%;
  clip-path: polygon(30% 0%,70% 0%,85% 10%,90% 22%,84% 38%,94% 52%,89% 62%,78% 52%,81% 76%,83% 100%,62% 100%,60% 76%,55% 58%,50% 54%,45% 58%,40% 76%,38% 100%,17% 100%,19% 76%,22% 52%,11% 62%,6% 52%,16% 38%,10% 22%,15% 10%);
  opacity: 0.3;
}
.mini-red  { background: linear-gradient(180deg, var(--corner-red), transparent); }
.mini-blue { background: linear-gradient(180deg, var(--corner-blue), transparent); }

.row-name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; line-height: 1.2; }
.row-record { font-size: 10px; color: var(--text-muted); font-weight: 600; }

.row-vs {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 54px;
}
.row-vs-text { font-size: 8px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.06em; }
.row-wt { font-size: 9px; color: rgba(255,255,255,0.2); font-weight: 600; text-align: center; }

.row-meta {
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
}
.expand-arrow {
  font-size: 9px; color: var(--text-muted);
  transition: transform 0.2s;
  line-height: 1;
}
.fight-row.expanded .expand-arrow { transform: rotate(180deg); }

/* ── Status pill ── */
.pill {
  font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 20px; white-space: nowrap;
}
.pill-scheduled { color: rgba(120,190,255,0.8); background: rgba(60,120,255,0.08); border: 1px solid rgba(60,120,255,0.18); }
.pill-live { color: #fff; background: var(--ufc-red); animation: pulse 1.5s ease-in-out infinite; }
.pill-win  { color: rgba(100,220,120,0.9); background: rgba(60,180,90,0.1); border: 1px solid rgba(60,180,90,0.2); }
.pill-draw { color: rgba(255,200,80,0.9); background: rgba(200,150,0,0.08); border: 1px solid rgba(200,150,0,0.2); }
@keyframes pulse { 0%,100%{ opacity:1 } 50%{ opacity:0.65 } }

/* ── Expanded panel ── */
.row-expanded { display: none; border-top: 1px solid rgba(255,255,255,0.05); }
.fight-row.expanded .row-expanded { display: block; }

/* Full fighter images + info */
.exp-fighters {
  display: grid; grid-template-columns: 1fr 48px 1fr;
  align-items: end; padding: 14px 12px 0; gap: 6px;
}
.exp-fighter { display: flex; flex-direction: column; align-items: center; }

/* Full-body fighter image frame */
.exp-img-frame {
  position: relative;
  width: 120px; height: 160px;
  overflow: hidden; border-radius: 10px 10px 0 0;
  background: rgba(255,255,255,0.03);
}
.exp-img-frame img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: top center;
  display: block;
}
.exp-img-fallback {
  width: 100%; height: 100%;
  display: flex; align-items: flex-end; justify-content: center;
}
.silhouette {
  width: 80%; height: 90%;
  clip-path: polygon(30% 0%,70% 0%,85% 10%,90% 22%,84% 38%,94% 52%,89% 62%,78% 52%,81% 76%,83% 100%,62% 100%,60% 76%,55% 58%,50% 54%,45% 58%,40% 76%,38% 100%,17% 100%,19% 76%,22% 52%,11% 62%,6% 52%,16% 38%,10% 22%,15% 10%);
  opacity: 0.45;
}
.sil-red  { background: linear-gradient(180deg, var(--corner-red) 0%, rgba(230,48,48,0.05) 100%); }
.sil-blue { background: linear-gradient(180deg, var(--corner-blue) 0%, rgba(48,96,224,0.05) 100%); }
.corner-pip { position: absolute; top: 8px; left: 8px; width: 7px; height: 7px; border-radius: 50%; }
.pip-red  { background: var(--corner-red);  box-shadow: 0 0 8px var(--corner-red); }
.pip-blue { background: var(--corner-blue); box-shadow: 0 0 8px var(--corner-blue); }

.exp-info { width: 100%; text-align: center; padding: 9px 4px 0; }
.exp-name { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.15; }
.exp-record { font-size: 11px; font-weight: 700; color: var(--text-dim); margin-top: 2px; }
.exp-detail { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.exp-odds { font-size: 11px; font-weight: 800; color: rgba(var(--bright),0.9); margin-top: 4px; }

.exp-vs {
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; padding-bottom: 50px; gap: 6px;
}
.vs-label { font-size: 15px; font-weight: 900; color: rgba(255,255,255,0.1); }

/* ── In-fight stat tabs ── */
.st-tabs { border-top: 1px solid rgba(255,255,255,0.06); }
.st-tabs-nav {
  display: flex; overflow-x: auto; scrollbar-width: none;
  padding: 0 12px; gap: 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.st-tabs-nav::-webkit-scrollbar { display: none; }
.st-tab-btn {
  flex-shrink: 0; padding: 9px 12px;
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted); background: none; border: none; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s; white-space: nowrap;
}
.st-tab-btn.st-active { color: rgba(255,255,255,0.85); border-bottom-color: var(--ufc-red); }
.st-tab-pane { display: none; }
.st-tab-pane.st-active { display: block; }

/* ── Stat comparison rows ── */
.sc-row {
  display: grid; grid-template-columns: 1fr 96px 1fr;
  align-items: center; gap: 4px;
  padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.04);
}
.sc-row:last-child { border-bottom: none; }
.sc-val {
  font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.8);
  font-variant-numeric: tabular-nums;
}
.sc-val.r { color: var(--corner-red); }
.sc-val.b { color: var(--corner-blue); text-align: right; }
.sc-lbl {
  font-size: 8px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted); text-align: center; line-height: 1.4;
}
/* Bar-style rows */
.sc-row.bar { grid-template-columns: 1fr; padding: 8px 14px; }
.sc-bar-text {
  display: grid; grid-template-columns: 1fr 96px 1fr;
  align-items: center; gap: 4px; margin-bottom: 5px;
}
.sc-bar-track {
  height: 4px; background: rgba(255,255,255,0.07);
  border-radius: 2px; overflow: hidden; margin: 2px 0;
}
.sc-bar-fill-r { height: 100%; background: var(--corner-red);  border-radius: 2px; }
.sc-bar-fill-b { height: 100%; background: var(--corner-blue); border-radius: 2px; }

/* Tab loading state */
.st-loading {
  padding: 18px 14px; text-align: center;
  font-size: 9px; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.st-spin {
  width: 11px; height: 11px; border: 1.5px solid rgba(255,255,255,0.1);
  border-top-color: var(--ufc-red); border-radius: 50%;
  animation: spin 0.8s linear infinite; flex-shrink: 0;
}

/* ── Loading / Error ── */
.loading-state, .error-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 200px; gap: 12px; text-align: center; padding: 32px;
}
.loading-spinner {
  width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.1);
  border-top-color: var(--ufc-red); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-title { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.6); }
.error-sub { font-size: 12px; color: var(--text-muted); }
.retry-btn {
  margin-top: 4px; padding: 8px 18px; background: rgba(210,10,10,0.15);
  border: 1px solid rgba(210,10,10,0.3); border-radius: 8px;
  color: rgba(210,10,10,0.9); font-size: 11px; font-weight: 700;
  cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase;
}
.retry-btn:hover { background: rgba(210,10,10,0.25); }

/* ── Polymarket block ── */

/* Live dot */
.pm-live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,0.15); flex-shrink: 0;
  transition: background 0.3s;
}
.pm-live-dot.pm-live-on {
  background: #22c55e;
  box-shadow: 0 0 6px #22c55e;
  animation: pmPulse 2s ease-in-out infinite;
}
@keyframes pmPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* Header */
.pm-block {
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 11px 14px 13px;
}
.pm-header {
  display: flex; align-items: center; gap: 7px; margin-bottom: 10px;
}
.pm-title {
  flex: 1; font-size: 9px; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-muted);
}
.pm-vol {
  font-size: 9px; color: rgba(255,255,255,0.18); font-weight: 600;
}

/* Odds bar */
.pm-probs { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.pm-fighter-row {
  display: flex; justify-content: space-between; align-items: center;
}
.pm-fname { font-size: 11px; font-weight: 700; color: var(--text-dim); }
.pm-pct { font-size: 12px; font-weight: 900; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.pm-pct.pm-fav { color: rgba(168,85,247,0.9); }
.pm-odds-bar {
  height: 5px; border-radius: 3px; overflow: hidden; display: flex;
  background: rgba(255,255,255,0.06); margin: -2px 0;
}
.pm-odds-red  { height: 100%; background: var(--corner-red);  transition: width 0.4s; }
.pm-odds-blue { height: 100%; background: var(--corner-blue); transition: width 0.4s; flex: 1; }
.pm-no-odds { font-size: 9px; color: var(--text-muted); margin-bottom: 8px; }

/* Sparkline chart */
.pm-chart-wrap {
  position: relative; margin-bottom: 10px;
  background: rgba(255,255,255,0.02); border-radius: 8px;
  padding: 6px 8px 4px; overflow: hidden;
}
.pm-chart-label {
  position: absolute; top: 6px; right: 10px;
  font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums;
  opacity: 0.8;
}
.pm-chart-svg { width: 100%; height: 60px; display: block; }

/* Order book */
.pm-book { margin-top: 2px; }
.pm-book-bar {
  display: flex; height: 20px; border-radius: 5px; overflow: hidden;
  background: rgba(255,255,255,0.04); gap: 1px;
}
.pm-bid-bar {
  background: rgba(48,192,96,0.2); display: flex; align-items: center;
  padding: 0 7px; border-radius: 4px 0 0 4px; min-width: 0;
  font-size: 8px; font-weight: 700; color: rgba(48,192,96,0.8);
  white-space: nowrap; overflow: hidden;
}
.pm-ask-bar {
  background: rgba(224,80,80,0.18); display: flex; align-items: center;
  justify-content: flex-end; padding: 0 7px; border-radius: 0 4px 4px 0;
  min-width: 0; font-size: 8px; font-weight: 700; color: rgba(224,80,80,0.8);
  white-space: nowrap; overflow: hidden; flex: 1;
}
.pm-spread-label {
  text-align: center; font-size: 8px; color: var(--text-muted);
  margin-top: 4px; font-weight: 600;
}

/* ── Per-fight Polymarket bet buttons ── */
.exp-bet-row {
  display: flex; gap: 8px;
  padding: 10px 12px 2px;
}
.exp-bet-btn {
  flex: 1; text-align: center;
  padding: 9px 12px;
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(168,85,247,0.9); text-decoration: none;
  border: 1px solid rgba(168,85,247,0.25); border-radius: 8px;
  background: rgba(168,85,247,0.08);
  transition: background 0.12s, border-color 0.12s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.exp-bet-btn:hover { background: rgba(168,85,247,0.18); border-color: rgba(168,85,247,0.4); }

/* ── Footer note ── */
.data-note {
  display: flex; align-items: center; gap: 7px;
  font-size: 10px; color: rgba(255,255,255,0.2);
  padding: 10px 14px; background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; margin-top: 8px;
}
</style>
</head>
<body>

<div id="root">
  <div class="loading-state">
    <div class="loading-spinner"></div>
    <div class="error-sub">Loading fight card…</div>
  </div>
</div>

<script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
<script>
// ─── fetch:external via SDK ───────────────────────────────────────────────────
async function fetchExternal(url) {
  return Dissent.fetch(url);
}

// ─── Theme ────────────────────────────────────────────────────────────────────
function applyTheme(theme) {
  if (theme['--theme-glow-rgb'])   document.documentElement.style.setProperty('--glow',   theme['--theme-glow-rgb']);
  if (theme['--theme-bright-rgb']) document.documentElement.style.setProperty('--bright', theme['--theme-bright-rgb']);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtRecord(r) {
  if (!r) return '';
  return r.replace(/-0$/, '');
}


function deriveUFCSlug(name, date) {
  const m = name.match(/UFC\s+(\d+)/i);
  if (m) return `ufc-${m[1]}`;
  const mo = MONTHS[date.getMonth()];
  return `ufc-fight-night-${mo}-${date.getDate()}-${date.getFullYear()}`;
}

function formatOdds(n) {
  return n > 0 ? '+' + n : String(n);
}

function slugKey(lastName) {
  return lastName.toLowerCase().replace(/\s+/g, '-');
}

function tryParseJSON(v) {
  if (Array.isArray(v)) return v;
  try { return JSON.parse(v); } catch { return null; }
}

// ─── Stat tab helpers ─────────────────────────────────────────────────────────
function stTab(key, tab, btn) {
  const wrap = document.getElementById('st-' + key);
  if (!wrap) return;
  wrap.querySelectorAll('.st-tab-btn').forEach(b => b.classList.remove('st-active'));
  wrap.querySelectorAll('.st-tab-pane').forEach(p => p.classList.remove('st-active'));
  btn.classList.add('st-active');
  const pane = wrap.querySelector('#stp-' + tab + '-' + key);
  if (pane) pane.classList.add('st-active');
}

function scRow(label, rv, bv) {
  return `<div class="sc-row"><div class="sc-val r">${rv}</div><div class="sc-lbl">${label}</div><div class="sc-val b">${bv}</div></div>`;
}



// ─── Countdown ────────────────────────────────────────────────────────────────
let _countdownTimer = null;

function startCountdown(isoDate) {
  const target = new Date(isoDate);
  function tick() {
    const el = document.getElementById('countdown');
    if (!el) return;
    const diff = target - Date.now();
    if (diff <= 0) { el.style.display = 'none'; return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.querySelector('#cd-d').textContent = String(d).padStart(2,'0');
    el.querySelector('#cd-h').textContent = String(h).padStart(2,'0');
    el.querySelector('#cd-m').textContent = String(m).padStart(2,'0');
    el.querySelector('#cd-s').textContent = String(s).padStart(2,'0');
  }
  clearInterval(_countdownTimer);
  _countdownTimer = setInterval(tick, 1000);
  tick();
}

// ─── Render helpers ───────────────────────────────────────────────────────────
function espnHeadshotUrl(athleteId) {
  return athleteId
    ? `https://a.espncdn.com/i/headshots/mma/players/full/${athleteId}.png`
    : null;

// ─── Toggle expand/collapse ───────────────────────────────────────────────────
function toggleExpand(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const wasExpanded = el.classList.contains('expanded');
  document.querySelectorAll('.fight-row.expanded').forEach(r => r.classList.remove('expanded'));
  if (!wasExpanded) {
    el.classList.add('expanded');
    const key = el.dataset.key;
    if (key && _lastEvent) {
      const fight = _lastEvent.fights.find(f => slugKey(f.red.lastName) === key);
      if (fight) {
        // Re-render PM in odds tab if data is ready
        if (_pmData[key]?.conditionId) renderPolymarketSection(fight, key);
      }
    }
  }
}

// ─── ESPN fetch + normalisation ───────────────────────────────────────────────
async function fetchESPN() {
  // Use the fetch:external proxy so the request is made server-side — avoids
  // null-origin CORS blocks in sandboxed iframes (notably WebView2 on Windows).
  const base = 'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard';
  const data = await fetchExternal(base);
  const parsed = JSON.parse(data.body);

  // If the current event is already final, scan ahead weekly for the next scheduled event.
  const ev = parsed.events?.[0];
  const isAllFinal = ev && (ev.competitions || []).every(
    c => c.status?.type?.completed === true
  );
  if (isAllFinal) {
    const start = new Date(ev.date);
    for (let week = 1; week <= 8; week++) {
      const d = new Date(start);
      d.setDate(d.getDate() + week * 7);
      const dateStr = d.toISOString().slice(0, 10).replace(/-/g, '');
      const next = await fetchExternalSilent(`${base}?dates=${dateStr}`);
      if (next?.events?.length) return next;
    }
  }

  return parsed;
}

function normaliseName(displayName) {
  const parts = displayName.trim().split(/\s+/);
  if (parts.length === 1) return { firstName: '', lastName: parts[0], fullName: displayName };
  return { firstName: parts[0], lastName: parts.slice(1).join(' '), fullName: displayName };
}

function parseESPN(data) {
  const ev = data.events?.[0];
  if (!ev) return null;

  const venue = ev.venues?.[0];
  const competitions = ev.competitions || [];

  // Map fight start times (per-competition date, fallback to event date)
  const times = competitions.map(c => new Date(c.date || ev.date).getTime());
  // The latest time is the main card start (ESPN orders prelims → main event)
  const latestTime = times.length ? Math.max(...times) : 0;

  const fights = competitions.map((comp, i) => {
    // ESPN uses order:1 = red corner (home), order:2 = blue corner (away)
    const red  = comp.competitors?.find(c => c.order === 1) || comp.competitors?.[0];
    const blue = comp.competitors?.find(c => c.order === 2) || comp.competitors?.[1];
    if (!red || !blue) return null;

    const parseF = (c) => {
      const n = normaliseName(c.athlete?.displayName || c.athlete?.fullName || '');
      return {
        ...n,
        athleteId: c.id || null,
        record:    c.records?.[0]?.summary || '',
        country:   c.athlete?.flag?.alt || '',
        flag:      '',
        ranking:   null,
      };
    };

    const wcName = comp.type?.text || comp.type?.abbreviation || '';
    const fightTime = times[i];

    // Prelim = starts 2+ hours before the main card (latest fight)
    const segment = (latestTime - fightTime) >= (2 * 60 * 60 * 1000) ? 'Preliminary Card' : 'Main Card';

    return {
      red:         parseF(red),
      blue:        parseF(blue),
      weightClass: wcName,
      rounds:      comp.format?.regulation?.periods || 3,
      segment,
      status:      comp.status?.type?.completed ? 'final' : 'scheduled',
      result:      null,
    };
  }).filter(Boolean);

  // ESPN returns fights in ascending order (first fight of night → main event).
  // Reverse so main event is index 0.
  fights.reverse();

  return {
    id:         ev.id,
    name:       ev.name,
    shortName:  ev.shortName,
    seriesName: ev.name.match(/UFC\s+\d+/i)?.[0] || 'UFC Fight Night',
    date:       ev.date,
    venue:      venue ? { city: venue.address?.city, state: venue.address?.state, name: venue.fullName } : null,
    fights,
  };
}

// ─── Main init ────────────────────────────────────────────────────────────────
let _lastConfig = {};
let _lastUser   = null;
let _refreshTimer = null;

async function init(config, user) {
  _lastConfig = config;
  _lastUser   = user;

  document.getElementById('root').innerHTML = `
    <div class="loading-state"><div class="loading-spinner"></div><div class="error-sub">Loading fight card…</div></div>`;

  try {
    const espnData = await fetchESPN();
    const event = parseESPN(espnData);
    if (!event || event.fights.length === 0) {
      showError('No upcoming UFC events found.');
      return;
    }

    render(event, {});
    enrichInBackground(event, config);

  } catch (err) {
    showError(err.message || 'Network error');
  }

  clearInterval(_refreshTimer);
  _refreshTimer = setInterval(() => init(config, user), 60 * 60 * 1000);
}

// ─── Background enrichment ────────────────────────────────────────────────────
async function enrichInBackground(event, config) {
  try { await fetchAndApplyPoster(event); } catch {}
  try {
    await enrichWithCloudFront(event);
  } catch (err) {
    console.warn('[UFC plugin] CloudFront enrichment failed:', err?.message || err);
  }
  // Polymarket runs alongside odds API — whichever has data wins
  try { await enrichWithPolymarket(event); } catch {}
  if (config.odds_api_key) {
  }
  const note = document.getElementById('data-note');
  if (note) note.textContent = 'Data: ESPN · UFC · Polymarket · Auto-updates hourly';
}

// Probe whether a URL resolves to a loadable image via browser-direct load.
// Bypasses the server-side 403 block on ufc.com — user's browser IP is not blocked.
function probeImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    const timer = setTimeout(() => { img.onload = img.onerror = null; resolve(false); }, 4000);
    img.onload  = () => { clearTimeout(timer); resolve(true); };
    img.onerror = () => { clearTimeout(timer); resolve(false); };
    img.src = url;
  });
}

// Transliterate accented/special chars to ASCII for URL slugs.
function toFileSlugPart(s) {
  return s.normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[đ]/gi, 'd').replace(/[ø]/gi, 'o')
    .replace(/[ł]/gi, 'l').replace(/[æ]/gi, 'ae').replace(/[ß]/gi, 'ss')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}

async function fetchAndApplyPoster(event) {
  const date = new Date(event.date);
  const mm   = String(date.getMonth() + 1).padStart(2, '0');
  const dd   = String(date.getDate()).padStart(2, '0');
  const yy   = String(date.getFullYear()).slice(-2);
  const datePfx = mm + dd + yy;  // e.g. "041126" for April 11 2026

  // Derive the filename slug from event number + main event fighters.
  const numMatch = event.name.match(/UFC\s+(\d+)/i);
  const main = event.fights?.[0];
  let fileSlug;
  if (numMatch && main) {
    fileSlug = `ufc-${numMatch[1]}-${toFileSlugPart(main.red.lastName)}-vs-${toFileSlugPart(main.blue.lastName)}`;
  } else if (numMatch) {
    fileSlug = `ufc-${numMatch[1]}`;
  } else if (main) {
    fileSlug = `ufc-fight-night-${toFileSlugPart(main.red.lastName)}-vs-${toFileSlugPart(main.blue.lastName)}`;
  } else {
    return;
  }

  // Build filename candidates. UFC.com uses: MMDDYY-ufc-{num}-{blue}-vs-{red}-EVENT-ART.jpg
  // (blue-corner fighter listed first, not red). Also try red-vs-blue order as fallback,
  // and the fight-night variant without the event number.
  const fnames = [];
  if (numMatch && main) {
    // Numbered event: try blue-vs-red first (UFC's actual naming convention), then red-vs-blue
    fnames.push(`${datePfx}-ufc-${numMatch[1]}-${toFileSlugPart(main.blue.lastName)}-vs-${toFileSlugPart(main.red.lastName)}-EVENT-ART.jpg`);
    fnames.push(`${datePfx}-ufc-${numMatch[1]}-${toFileSlugPart(main.red.lastName)}-vs-${toFileSlugPart(main.blue.lastName)}-EVENT-ART.jpg`);
    fnames.push(`${datePfx}-${fileSlug}-EVENT-ART.jpg`);
  } else if (main) {
    // Fight night: try both orderings
    fnames.push(`${datePfx}-ufc-fight-night-${toFileSlugPart(main.blue.lastName)}-vs-${toFileSlugPart(main.red.lastName)}-EVENT-ART.jpg`);
    fnames.push(`${datePfx}-${fileSlug}-EVENT-ART.jpg`);
  } else {
    fnames.push(`${datePfx}-${fileSlug}-EVENT-ART.jpg`);
  }

  // Event art is uploaded 1–3 months before the event. Try each candidate month.
  // Probed AND rendered through Dissent.imageUrl() (the node image proxy).
  // The previous comment here claimed ufc.com blocks server/proxy IPs and only
  // browser-direct loads work; that is wrong — the proxy fetches these fine
  // (verified 2026-07-22: 200, image/jpeg, 768x512) while a bare server-side
  // request 403s. Browser-direct is also blocked by the plugin CSP now, which is
  // why the poster silently stopped appearing.
  const candidates = [];
  for (let mOffset = 0; mOffset <= 2; mOffset++) {
    const d = new Date(date.getFullYear(), date.getMonth() - mOffset, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    for (const fname of fnames) candidates.push(`https://ufc.com/images/styles/background_image_sm/s3/${ym}/${fname}`);
  }

  for (const url of candidates) {
    const proxied = Dissent.imageUrl(url);
    if (await probeImage(proxied)) {
      const el = document.getElementById('hero-poster');
      if (el) { el.src = proxied; el.style.display = 'block'; }
      return;
    }
  }
}

// Reference: CloudFront event ID 1302 = 2026-03-28
const CF_BASE_ID   = 1305;
const CF_BASE_TIME = new Date('2026-04-18').getTime();
const CF_URL       = id => `https://d29dxerjsp82wz.cloudfront.net/api/v3/event/live/${id}.json`;

async function findCloudFrontId(targetDate) {
  const MS_PER_WEEK = 7 * 24 * 60 * 60 * 1000;
  const weeksOff  = Math.round((targetDate.getTime() - CF_BASE_TIME) / MS_PER_WEEK);
  const startId   = Math.max(1, CF_BASE_ID + weeksOff);

  for (let delta = 0; delta <= 20; delta++) {
    for (const id of delta === 0 ? [startId] : [startId + delta, startId - delta]) {
      if (id < 1) continue;
      try {
        const data = await fetchExternal(CF_URL(id));
        if (data.status !== 200) continue;
        const cf = JSON.parse(data.body);
        // Actual CF structure: cf.LiveEventDetail.StartTime
        const startTime = cf.LiveEventDetail?.StartTime || cf.FightCard?.Event?.StartTime || cf.StartTime || '';
        if (!startTime) continue;
        const cfDate = new Date(startTime);
        if (Math.abs(cfDate.getTime() - targetDate.getTime()) < 3 * 24 * 60 * 60 * 1000) {
          return cf;
        }
      } catch {}
    }
  }
  return null;
}

async function enrichWithCloudFront(event) {
  const cf = await findCloudFrontId(new Date(event.date));
  if (!cf) return;

  // Actual CF structure: cf.LiveEventDetail.FightCard = array of fight objects
  // Each fight has Fighters:[{FirstName,LastName,Corner:"Red"|"Blue",Height,Reach,Stance}]
  const fights = cf.LiveEventDetail?.FightCard || cf.FightCard?.Fights || cf.Fights || [];
  for (const cfFight of fights) {
    const fArr = cfFight.Fighters || [];
    const red  = fArr.find(f => f.Corner === 'Red')  || fArr[0];
    const blue = fArr.find(f => f.Corner === 'Blue') || fArr[1];
    if (!red || !blue) continue;

    const redLast = red.LastName || red.Name?.Last || '';
    const key = slugKey(redLast);
    const cfEl = document.getElementById('stp-matchup-cf-' + key);
    if (!cfEl) continue;

    const fmt = v => (v != null && v !== '') ? String(v) : '—';
    const redH  = parseFloat(red.Height  || 0);
    const blueH = parseFloat(blue.Height || 0);
    const maxH  = Math.max(redH, blueH, 0.001);
    const redR  = parseFloat(red.Reach   || 0);
    const blueR = parseFloat(blue.Reach  || 0);
    const maxR  = Math.max(redR, blueR, 0.001);
    cfEl.innerHTML =
      `<div class="sc-row bar">
        <div class="sc-bar-text"><div class="sc-val r">${fmt(red.Height)}"</div><div class="sc-lbl">Height</div><div class="sc-val b">${fmt(blue.Height)}"</div></div>
        <div class="sc-bar-track"><div class="sc-bar-fill-r" style="width:${Math.round(redH/maxH*100)}%"></div></div>
        <div class="sc-bar-track"><div class="sc-bar-fill-b" style="width:${Math.round(blueH/maxH*100)}%"></div></div>
      </div>`
      + `<div class="sc-row bar">
        <div class="sc-bar-text"><div class="sc-val r">${fmt(red.Reach)}"</div><div class="sc-lbl">Reach</div><div class="sc-val b">${fmt(blue.Reach)}"</div></div>
        <div class="sc-bar-track"><div class="sc-bar-fill-r" style="width:${Math.round(redR/maxR*100)}%"></div></div>
        <div class="sc-bar-track"><div class="sc-bar-fill-b" style="width:${Math.round(blueR/maxR*100)}%"></div></div>
      </div>`
      + (red.Weight ? scRow('Weight', fmt(red.Weight) + ' lbs', fmt(blue.Weight) + ' lbs') : '')
      + scRow('Stance', fmt(red.Stance), fmt(blue.Stance));
  }
}

// ─── Polymarket enrichment ────────────────────────────────────────────────────
// Shows Polymarket win-probability odds for each fight via slug discovery,
// live WebSocket price updates, price history sparklines, and order book depth.
// Never handles wallets, keys, or accounts — read-only public data only.
// Per-fight "Bet on [Fighter]" buttons open polymarket.com in a new tab; hrefs are updated async.

const _pmData = {};  // key → fight's polymarket data
let _pmPollTimer = null;    // single poll timer for all fights

async function fetchExternalSilent(url) {
  try {
    const data = await fetchExternal(url);
    if (data.status !== 200) return null;
    return JSON.parse(data.body);
  } catch { return null; }
}

// Fetch the Polymarket UFC sports page and extract all fight slugs.
// Polymarket's sports-section markets are NOT indexed by the Gamma API prediction
// market endpoints — the only reliable source is the sports page itself.
async function fetchPolymarketSportsSlugs() {
  try {
    const resp = await fetchExternal('https://polymarket.com/sports/ufc/games');
    if (resp.status !== 200) return [];
    const html = resp.body;
    // Collect every unique slug that matches the fight slug pattern:
    // ufc-{3letters}{digit}-{3letters}{digit}-YYYY-MM-DD
    const slugSet = new Set();
    for (const m of html.matchAll(/ufc-([a-z]{3}\d+)-([a-z]{3}\d+)-(\d{4}-\d{2}-\d{2})/g)) {
      slugSet.add(m[0]);
    }
    console.log('[UFC plugin] Sports page slugs:', [...slugSet].join(' | '));
    return [...slugSet];
  } catch (e) {
    console.warn('[UFC plugin] Sports page fetch failed:', e?.message);
    return [];
  }
}

// Match a Polymarket sports slug to an ESPN fight using first-name abbreviations.
// Slug format: ufc-{first3(red)}{n}-{first3(blue)}{m}-YYYY-MM-DD
// Works in both fighter orders since UFC doesn't guarantee red=first in slug.
function matchSlugToFight(slug, fights) {
  const m = slug.match(/^ufc-([a-z]{3})\d+-([a-z]{3})\d+-\d{4}-\d{2}-\d{2}$/);
  if (!m) return null;
  const [, abbr1, abbr2] = m;
  for (const fight of fights) {
    const r3 = fight.red.firstName.toLowerCase().slice(0, 3);
    const b3 = fight.blue.firstName.toLowerCase().slice(0, 3);
    if ((abbr1 === r3 && abbr2 === b3) || (abbr1 === b3 && abbr2 === r3)) {
      return fight;
    }
  }
  return null;
}

// Prop-bet keywords in Polymarket slugs — these are not main win/loss markets
const PM_PROP_KEYWORDS = [
  'touch-gloves', 'go-the-distance', 'distance', 'first-round',
  'method-of-victory', 'method', 'finish', 'tko-or', 'sub-or',
  'inside-distance', 'fight-to-last',
];

async function enrichWithPolymarket(event) {
  // Pass 1: placeholder search URLs for all fights
  for (const fight of event.fights) {
    const key = slugKey(fight.red.lastName);
    const searchUrl = `https://polymarket.com/predictions?_q=${encodeURIComponent(fight.red.firstName + '-' + fight.red.lastName).toLowerCase()}`;
    _pmData[key] = { slug: null, searchUrl };
    renderPolymarketSection(fight, key);
  }

  // Pass 2: get real fight slugs from Polymarket's UFC sports page.
  // The Gamma prediction-market API does not index sports-section markets.
  const sportsSlugs = await fetchPolymarketSportsSlugs();

  for (const slug of sportsSlugs) {
    const fight = matchSlugToFight(slug, event.fights);
    if (!fight) continue;
    const key      = slugKey(fight.red.lastName);
    const fightUrl = `https://polymarket.com/sports/ufc/${slug}`;

    if (!_pmData[key]) _pmData[key] = {};
    _pmData[key].slug      = slug;
    _pmData[key].searchUrl = fightUrl;

    // Update bet buttons immediately
    const redBtn  = document.getElementById('bet-red-'  + key);
    const blueBtn = document.getElementById('bet-blue-' + key);
    if (redBtn)  redBtn.href = fightUrl;
    if (blueBtn) blueBtn.href = fightUrl;
  }

  // Pass 3: enrich with live odds from Gamma API (prop-filtered, non-blocking)
  enrichOddsFromGamma(event).catch(() => {});

  connectPolymarketWS(event);
}

async function enrichOddsFromGamma(event) {
  const seen = new Set();
  const all  = [];
  function collect(data) {
    if (!Array.isArray(data)) return;
    for (const e of data) {
      const k = e.id || e.slug;
      if (k && !seen.has(k)) { seen.add(k); all.push(e); }
    }
  }

  // Fetch all tag buckets in parallel
  await Promise.all(['mma','ufc','combat-sports','sports'].flatMap(tag => [
    fetchExternalSilent(`https://gamma-api.polymarket.com/events?tag_slug=${tag}&active=true&limit=200`).then(collect),
    fetchExternalSilent(`https://gamma-api.polymarket.com/events?tag_slug=${tag}&limit=200`).then(collect),
  ]));

  for (const pmEvent of all) {
    const evTitle = (pmEvent.title || pmEvent.name || '').toLowerCase();
    const evSlug  = (pmEvent.slug || '').toLowerCase();
    if (PM_PROP_KEYWORDS.some(k => evSlug.includes(k))) continue;

    for (const fight of event.fights) {
      const { red, blue } = fight;
      const key      = slugKey(red.lastName);
      if (_pmData[key]?.conditionId) continue;
      const redLast  = red.lastName.toLowerCase();
      const blueLast = blue.lastName.toLowerCase();
      const r3 = red.firstName.toLowerCase().slice(0, 3);
      const b3 = blue.firstName.toLowerCase().slice(0, 3);

      const eventMatch =
        (evTitle.includes(redLast) && evTitle.includes(blueLast)) ||
        (evSlug.includes(r3) && evSlug.includes(b3)) ||
        (evSlug.includes(redLast.slice(0,3)) && evSlug.includes(blueLast.slice(0,3)));

      let matchedMkt = null;
      for (const mkt of (pmEvent.markets || [])) {
        const outcomes = tryParseJSON(mkt.outcomes) || [];
        const prices   = tryParseJSON(mkt.outcomePrices) || [];
        if (outcomes.length !== 2 || prices.length !== 2) continue;
        if (outcomes.every(o => ['yes','no'].includes(o.toLowerCase()))) continue;
        const ri = outcomes.findIndex(o => o.toLowerCase().includes(redLast));
        const bi = outcomes.findIndex(o => o.toLowerCase().includes(blueLast));
        if (ri === -1 || bi === -1) continue;
        matchedMkt = { mkt, redIdx: ri, blueIdx: bi, prices, outcomes };
        break;
      }
      if (!eventMatch && !matchedMkt) continue;

      const mkt      = matchedMkt?.mkt || pmEvent.markets?.[0] || {};
      const outcomes = matchedMkt?.outcomes || tryParseJSON(mkt.outcomes) || [red.fullName, blue.fullName];
      const prices   = matchedMkt?.prices   || tryParseJSON(mkt.outcomePrices) || ['0.5','0.5'];
      const redIdx   = matchedMkt?.redIdx  ?? outcomes.findIndex(o => o.toLowerCase().includes(redLast)) ?? 0;
      const blueIdx  = matchedMkt?.blueIdx ?? (redIdx === 0 ? 1 : 0);
      const tokenIds = tryParseJSON(mkt.clobTokenIds) || [];

      Object.assign(_pmData[key], {
        conditionId: mkt.conditionId || pmEvent.id,
        tokenIds, outcomes, redIdx, blueIdx,
        redProb:   Math.round(parseFloat(prices[redIdx])  * 100),
        blueProb:  Math.round(parseFloat(prices[blueIdx]) * 100),
        volume:    parseFloat(mkt.volume     || pmEvent.volume    || 0),
        volume24h: parseFloat(mkt.volume24hr || 0),
        liquidity: parseFloat(mkt.liquidity  || pmEvent.liquidity || 0),
        bestBid:   parseFloat(mkt.bestBid    || 0),
        bestAsk:   parseFloat(mkt.bestAsk    || 0),
        history:   _pmData[key]?.history || [],
        bids:      _pmData[key]?.bids    || [],
        asks:      _pmData[key]?.asks    || [],
      });

      renderPolymarketSection(fight, key);

      const redToken = tokenIds[redIdx];
      if (redToken) {
        fetchExternalSilent(`https://clob.polymarket.com/prices-history?market=${redToken}&interval=all&fidelity=60`)
          .then(r => { if (r) { _pmData[key].history = r.history || []; renderPolymarketSection(fight, key); } });
        fetchExternalSilent(`https://clob.polymarket.com/book?token_id=${redToken}`)
          .then(r => { if (r) { _pmData[key].bids = r.bids || []; _pmData[key].asks = r.asks || []; renderPolymarketSection(fight, key); } });
      }
    }
  }

  connectPolymarketWS(event);
}

function connectPolymarketWS(event) {
  // CSP blocks the external WebSocket (wss://ws-subscriptions-clob.polymarket.com).
  // Poll the already-allowlisted CLOB REST price endpoint through the fetch:external
  // proxy instead — same price data, ~15s cadence, no direct socket, user IP hidden.
  if (_pmPollTimer) return;
  const poll = () => {
    const allTokenIds = Object.values(_pmData).flatMap(d => d.tokenIds || []).filter(Boolean);
    if (!allTokenIds.length) return;
    document.querySelectorAll('.pm-live-dot').forEach(el => el.classList.add('pm-live-on'));
    allTokenIds.forEach(tokenId => {
      fetchExternalSilent(`https://clob.polymarket.com/price?token_id=${tokenId}&side=buy`)
        .then(r => {
          if (r && r.price != null) handlePMPriceUpdate({ asset_id: tokenId, price: r.price }, event);
        });
    });
  };
  poll();
  _pmPollTimer = setInterval(poll, 15000);
}

function handlePMPriceUpdate(msg, event) {
  if (!msg.asset_id || !msg.price) return;
  const newPrice = parseFloat(msg.price);
  if (isNaN(newPrice)) return;

  for (const fight of event.fights) {
    const key = slugKey(fight.red.lastName);
    const d = _pmData[key];
    if (!d || !d.tokenIds) continue;

    const tokenIndex = d.tokenIds.indexOf(msg.asset_id);
    if (tokenIndex === -1) continue;

    if (tokenIndex === d.redIdx) {
      d.redProb  = Math.round(newPrice * 100);
      d.blueProb = 100 - d.redProb;
    } else {
      d.blueProb = Math.round(newPrice * 100);
      d.redProb  = 100 - d.blueProb;
    }

    // Add to history for sparkline
    d.history.push({ t: Date.now() / 1000, p: tokenIndex === d.redIdx ? newPrice : 1 - newPrice });

    // Re-render if this fight is expanded
    const rowEl = document.querySelector(`[data-key="${key}"].expanded`);
    if (rowEl) renderPolymarketSection(fight, key);
    break;
  }
}

function renderPolymarketSection(fight, key) {
  const d = _pmData[key];
  if (!d) return;
  const statsWrap = document.getElementById('stp-odds-' + key);
  if (!statsWrap) return;

  const { red, blue } = fight;
  const hasOdds    = d.redProb != null && d.blueProb != null;
  const hasHistory = d.history && d.history.length > 4;
  const hasBook    = d.bids && d.bids.length > 0;

  const fmtVol = v => v >= 1000000 ? `$${(v/1000000).toFixed(1)}M` : v >= 1000 ? `$${(v/1000).toFixed(0)}K` : `$${v}`;
  // Build the sparkline SVG if we have history
  let sparkSvg = '';
  if (hasHistory) {
    const pts = d.history;
    const minP = Math.min(...pts.map(p => p.p));
    const maxP = Math.max(...pts.map(p => p.p));
    const minT = pts[0].t;
    const maxT = pts[pts.length - 1].t;
    const W = 340, H = 60;
    const xS = t => ((t - minT) / (maxT - minT + 1)) * W;
    const yS = p => H - 4 - ((p - minP) / (maxP - minP + 0.0001)) * (H - 8);
    const polyPts = pts.map(p => `${xS(p.t).toFixed(1)},${yS(p.p).toFixed(1)}`).join(' ');
    const lastX   = xS(maxT).toFixed(1);
    const lastY   = yS(pts[pts.length-1].p).toFixed(1);
    const firstP  = pts[0].p;
    const lastPr  = pts[pts.length-1].p;
    const trendColor = lastPr >= firstP ? '#22c55e' : '#ef4444';
    // current price label
    const pctLabel = hasOdds ? `${d.redProb}%` : `${Math.round(lastPr*100)}%`;
    sparkSvg = `
    <div class="pm-chart-wrap">
      <div class="pm-chart-label" style="color:${trendColor}">${pctLabel}</div>
      <svg class="pm-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="pmg-${key}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${trendColor}" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="${trendColor}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="${polyPts} ${lastX},${H} ${xS(minT).toFixed(1)},${H}" fill="url(#pmg-${key})"/>
        <polyline points="${polyPts}" fill="none" stroke="${trendColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${lastX}" cy="${lastY}" r="3" fill="${trendColor}"/>
      </svg>
    </div>`;
  }

  // Order book depth bar
  let bookHtml = '';
  if (hasBook) {
    const topBid = parseFloat(d.bids[0]?.price || 0);
    const topAsk = parseFloat(d.asks[0]?.price || 1);
    const bidPct = Math.round(topBid * 100);
    const askPct = Math.round(topAsk * 100);
    const spread = (topAsk - topBid).toFixed(2);
    bookHtml = `
    <div class="pm-book">
      <div class="pm-book-bar">
        <div class="pm-bid-bar" style="width:${bidPct}%">
          <span>BID ${topBid.toFixed(2)}</span>
        </div>
        <div class="pm-ask-bar" style="width:${100-askPct}%">
          <span>ASK ${topAsk.toFixed(2)}</span>
        </div>
      </div>
      <div class="pm-spread-label">Spread ${spread}</div>
    </div>`;
  }

  const html = `<div style="padding: 11px 14px 13px">
    <div class="pm-header">
      <span class="pm-live-dot${_pmPollTimer ? ' pm-live-on' : ''}"></span>
      <span class="pm-title">🟣 Polymarket</span>
      ${d.volume > 0 ? `<span class="pm-vol">${fmtVol(d.volume)} vol · ${fmtVol(d.liquidity)} liq</span>` : ''}
    </div>
    ${hasOdds ? `
    <div class="pm-probs">
      <div class="pm-fighter-row">
        <span class="pm-fname">${red.firstName} ${red.lastName}</span>
        <span class="pm-pct ${d.redProb > d.blueProb ? 'pm-fav' : ''}" id="pm-rp-${key}">${d.redProb}%</span>
      </div>
      <div class="pm-odds-bar">
        <div class="pm-odds-red" style="width:${d.redProb}%" id="pm-bar-r-${key}"></div>
        <div class="pm-odds-blue" style="width:${d.blueProb}%" id="pm-bar-b-${key}"></div>
      </div>
      <div class="pm-fighter-row">
        <span class="pm-fname">${blue.firstName} ${blue.lastName}</span>
        <span class="pm-pct ${d.blueProb > d.redProb ? 'pm-fav' : ''}" id="pm-bp-${key}">${d.blueProb}%</span>
      </div>
    </div>` : `<div class="pm-no-odds">No active market found on Polymarket</div>`}
    ${sparkSvg}
    ${bookHtml}
  </div>`;

  statsWrap.innerHTML = html;
}


// ─── SDK init ─────────────────────────────────────────────────────────────────
async function main() {
  const ctx = await Dissent.init({ onFallback: () => console.warn('Running outside Dissent') });
  applyTheme(ctx.theme || {});
  init(ctx.config || {}, ctx.user || null);

  Dissent.on('theme-update', (theme) => applyTheme(theme || {}));
}

main().catch(err => console.error(err));
</script>
