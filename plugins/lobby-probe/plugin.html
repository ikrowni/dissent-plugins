<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lobby Probe</title>
<style>
  body { font-family: system-ui, sans-serif; background: #140908; color: #f3e6cf; margin: 0; padding: 16px; }
  code { color: #ffbe76; }
  p { margin: 6px 0; }
  li { margin: 2px 0; }
</style>
</head>
<body>
  <p>Context: <code id="ctx">waiting for dissent:init…</code></p>
  <p>Table: <code id="lobby">—</code></p>
  <p>Sent: <code id="sent">0</code> · Off-lane in a sidebar: <code id="offlane">—</code></p>
  <p>Heard:</p>
  <ul id="got"></ul>
<script>
// A test game for the games hub (spec 2026-10-19 §6). It speaks the raw host protocol so it depends on
// no SDK copy: dissent:init in, dissent:request out, dissent:response and dissent:event in.
let nextId = 1;
const pending = {};
function request(action, params) {
  return new Promise((resolve) => {
    const id = nextId++;
    pending[id] = resolve;
    parent.postMessage({ type: 'dissent:request', id, action, params }, '*');
  });
}
let me = null;
async function showLobby() {
  const r = await request('games.lobby', {});
  if (!r.ok) { document.getElementById('lobby').textContent = `error: ${r.error}`; return; }
  const l = r.data;
  me = l.you;
  document.getElementById('lobby').textContent =
    `${l.status} · ${l.members.filter((m) => m.role === 'player').length} players · you: ${l.you ? `${l.you.role} seat ${l.you.seat}` : 'not seated'}`;
}
window.addEventListener('message', async (e) => {
  const m = e.data;
  if (m?.type === 'dissent:response' && pending[m.id]) { pending[m.id](m); delete pending[m.id]; return; }
  if (m?.type === 'dissent:event' && m.event === 'game.lobby') { showLobby(); return; }
  if (m?.type === 'dissent:event' && m.event === 'game.message') {
    const li = document.createElement('li');
    li.textContent = `${m.data.from}: ${JSON.stringify(m.data.data)}`;
    document.getElementById('got').appendChild(li);
    return;
  }
  if (m?.type !== 'dissent:init') return;
  const c = m.context;
  document.getElementById('ctx').textContent = `contextType=${c.contextType} placement=${c.placement ?? '-'} lobbyId=${c.lobbyId ?? '-'}`;
  if (c.contextType === 'sidebar') {
    // The sidebar may read this game's open tables, and nothing else on the games lane.
    const t = await request('games.lobbies', {});
    document.getElementById('lobby').textContent = t.ok ? `${t.data.lobbies.length} open tables` : `error: ${t.error}`;
    const off = await request('games.send', { data: 1 });
    document.getElementById('offlane').textContent = off.ok ? 'ALLOWED (unexpected)' : `refused: ${off.error}`;
    return;
  }
  await showLobby();
  if (me?.role !== 'player') return; // watchers see, they don't speak
  for (let n = 1; n <= 3; n++) {
    const r = await request('games.send', { data: { hello: me.user_id, n } });
    if (r.ok) document.getElementById('sent').textContent = String(n);
    await new Promise((res) => setTimeout(res, 1000));
  }
});
</script>
</body>
</html>
