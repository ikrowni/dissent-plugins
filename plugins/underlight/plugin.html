<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Underlight</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #ffe2bf; font-family: Georgia, 'Times New Roman', serif; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hud { position: absolute; left: 14px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .hud .row { display: flex; align-items: center; gap: 8px; }
  .hud .lbl { width: 38px; font-size: 12px; color: rgb(255 236 210 / .7); font-style: italic; }
  .hud .bar { width: 180px; max-width: 32vw; height: 9px; border-radius: 5px; background: rgb(0 0 0 / .55); box-shadow: inset 0 0 0 1px rgb(255 220 180 / .18); overflow: hidden; }
  .hud .fill { height: 100%; border-radius: 5px; transition: width .12s linear; }
  #hpFill { background: linear-gradient(90deg, #8a2a22, #d0574a); }
  #oilFill { background: linear-gradient(90deg, #a8661c, #ffcf86); box-shadow: 0 0 10px rgb(255 190 118 / .6); }
  #flask { font-size: 12px; color: rgb(255 236 210 / .75); padding-left: 46px; }
  .status { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-style: italic; font-size: 15px; text-shadow: 0 0 10px #000; pointer-events: none; text-align: center; white-space: nowrap; }
  .status.warn { color: #ff8f7a; } .status.violet { color: #c4a6ff; }
  #boss { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); width: min(420px, 60vw); text-align: center; pointer-events: none; }
  #boss[hidden] { display: none; }
  #bossName { font-style: italic; font-size: 14px; color: #ffcf9a; letter-spacing: .04em; }
  #boss .bar { width: 100%; max-width: none; height: 7px; margin-top: 4px; border-radius: 4px; background: rgb(0 0 0 / .6); box-shadow: inset 0 0 0 1px rgb(255 200 150 / .2); overflow: hidden; }
  #bossFill { height: 100%; background: linear-gradient(90deg, #6e1e18, #c4483a); transition: width .15s linear; }
  #corner { position: absolute; right: 14px; top: 12px; font-size: 13px; color: rgb(255 236 210 / .78); pointer-events: none; }
  .keys { position: absolute; left: 14px; bottom: 12px; font: 11.5px/1.6 system-ui, sans-serif; color: rgb(255 236 210 / .7); background: rgb(0 0 0 / .45); border: 1px solid rgb(255 220 180 / .12); padding: 8px 10px; border-radius: 10px; pointer-events: none; }
  .keys kbd { font: 600 10.5px system-ui, sans-serif; background: rgb(255 255 255 / .1); padding: 1px 5px; border-radius: 4px; color: #fff; }
  #card { position: absolute; inset: 0; display: none; place-items: center; background: rgb(0 0 0 / .55); }
  #card.show { display: grid; }
  #card .box { max-width: 520px; margin: 16px; padding: 22px 24px; background: rgb(14 11 9 / .94); border: 1px solid rgb(255 200 140 / .2); border-radius: 16px; box-shadow: 0 20px 60px rgb(0 0 0 / .6); }
  #card h3 { margin: 0 0 8px; font-size: 26px; font-weight: 400; font-style: italic; color: #ffd9a8; }
  #card p { margin: 6px 0; color: rgb(255 236 210 / .82); font-size: 14.5px; }
  #card .row { display: flex; gap: 10px; margin-top: 16px; }
  #card button { font: inherit; font-family: system-ui, sans-serif; color: inherit; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 220 180 / .2); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  #card button.pri { background: linear-gradient(135deg, #b9772f, #e0a35a); color: #160d04; font-weight: 700; border: 0; }
  #card button:focus-visible { outline: 2px solid #ffbe76; outline-offset: 2px; }
  @media (max-width: 520px) { .keys { display: none; } }
</style>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Underlight: the game"></canvas>
  <div class="hud">
    <div class="row"><span class="lbl">Body</span><div class="bar"><div class="fill" id="hpFill"></div></div></div>
    <div class="row"><span class="lbl">Oil</span><div class="bar"><div class="fill" id="oilFill"></div></div></div>
    <div id="flask"></div>
  </div>
  <div id="status" class="status" role="status"></div>
  <div id="boss" hidden><div id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="corner"></div>
  <div class="keys">
    <kbd>A</kbd><kbd>D</kbd> move · <kbd>W</kbd>/<kbd>Space</kbd> jump · <kbd>S</kbd>+jump drop · <kbd>Left click</kbd>/<kbd>J</kbd> attack · <kbd>Right click</kbd>/<kbd>K</kbd> block<br>
    <kbd>Shift</kbd> roll · <kbd>E</kbd> throw / call back the lantern · <kbd>F</kbd> flask · <kbd>P</kbd> pause · <kbd>M</kbd> mute
  </div>
  <div id="card" aria-live="polite"></div>
  <script type="module" src="ul-main.js?v=1a"></script>
</body>
</html>
