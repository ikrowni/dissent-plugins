<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>LanternKeep Player</title>
  <link rel="stylesheet" href="lanternkeep-theme.css">
  <link rel="stylesheet" href="dnd-player-styles.css?v=20261015t">
</head>
<body>
  <div id="loading" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:var(--muted);gap:8px">
    <div class="spinner"></div>Loading sheet…
  </div>
  <div id="app" style="display:none;flex-direction:column;height:100%">
    <div class="sheet-head">
      <div style="flex:1;min-width:0">
        <div class="lk-title" style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="char-name">—</div>
        <div style="font-size:10px;color:var(--muted)" id="char-subtitle">—</div>
      </div>
      <button onclick="toggleSheetGuides()" class="sheet-edit" id="sheet-guides" title="Guides: short tips the first time something happens" aria-label="Guides" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M12 3v2M8 8h8l-1 11H9z"/><path d="M7 8l1-3h8l1 3"/><path d="M12 11c1.2 1.4 1.2 2.8 0 4.2-1.2-1.4-1.2-2.8 0-4.2z" fill="currentColor"/></svg></button>
      <button onclick="openCharEdit()" class="sheet-edit" title="Edit character" aria-label="Edit character"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button>
    </div>
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('main')">Main</div>
      <div class="tab" onclick="switchTab('combat')">Combat</div>
      <div class="tab" onclick="switchTab('abilities')">Abilities</div>
      <div class="tab" onclick="switchTab('spells')">Spells</div>
      <div class="tab" onclick="switchTab('inventory')">Inventory</div>
      <div class="tab" onclick="switchTab('features')">Features</div>
      <div class="tab" onclick="switchTab('notes')">Notes</div>
      <div class="tab" onclick="switchTab('resources')">Resources</div>
    </div>
    <div class="tab-content">
      <div class="tab-pane active" id="tab-main"></div>
      <div class="tab-pane" id="tab-combat"></div>
      <div class="tab-pane" id="tab-abilities"></div>
      <div class="tab-pane" id="tab-spells"></div>
      <div class="tab-pane" id="tab-inventory"></div>
      <div class="tab-pane" id="tab-features"></div>
      <div class="tab-pane" id="tab-notes"></div>
      <div class="tab-pane" id="tab-resources"></div>
    </div>
    <div class="dice-bar" id="dice-bar"></div>
  </div>
  <script>
  // Surface failures instead of spinning forever. The entry below is a dynamic
  // import() whose rejection was previously unhandled, so ANY load-time error
  // (bad specifier, 404, syntax error, throw during module init) left the user
  // staring at "Loading sheet…" with nothing in the UI to explain it.
  window.__dndPlayerFail = function (what, detail) {
    var el = document.getElementById('loading');
    if (!el) return;
    el.innerHTML = '<div style="padding:14px;font-size:11px;color:#f87171;white-space:pre-wrap">' +
      what + '\n' + String(detail || '') + '</div>';
  };
  window.addEventListener('error', function (e) {
    window.__dndPlayerFail('Sidebar error:', (e.message || '') + '\n' + (e.filename || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__dndPlayerFail('Sidebar failed:', e.reason && (e.reason.stack || e.reason.message) || e.reason);
  });

  // Buffer host messages until the module graph is ready.
  //
  // The host posts dissent:init on the iframe's load event. A <script type="module"
  // src> blocks that event, so plugins built that way (dnd-hub) always have their
  // listener registered in time. This plugin boots with a dynamic import() from an
  // inline module, which does NOT block load — so init was posted before the real
  // listener existed and was dropped, leaving the panel on "Loading sheet…" forever.
  // Plugin assets are served no-store, so the import never wins that race.
  window.__dndPlayerQueue = [];
  window.addEventListener('message', function (e) {
    if (!window.__dndPlayerReady) window.__dndPlayerQueue.push(e);
  });
  </script>
  <script type="module">
    import('./dnd-player-main.js?v=20261015t')
      .catch(err => window.__dndPlayerFail('Could not load the sheet module:', err && (err.stack || err.message) || err));
  </script>
</body>
</html>
