<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NFL Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --nfl-blue: #013369;
  --nfl-red: #D50A0A;
  --nfl-gold: #FFB612;
  --bg: #0a0a14;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: rgba(255,255,255,0.9);
  --text-dim: rgba(255,255,255,0.5);
  --text-muted: rgba(255,255,255,0.25);
  --win: #22c55e;
  --loss: #ef4444;
}
html { scroll-behavior: smooth; }
body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.4; }

/* Animations */
@keyframes spin        { to { transform: rotate(360deg); } }
@keyframes blink       { 0%,100%{opacity:1} 50%{opacity:.15} }
@keyframes pulse-red   { 0%,100%{box-shadow:0 0 0 0 rgba(213,10,10,.4)} 50%{box-shadow:0 0 0 6px rgba(213,10,10,0)} }
@keyframes barPulse    { 0%,100%{opacity:.5} 50%{opacity:1} }
@keyframes logoEntrance{ from{transform:scale(.55) translateY(8px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
@keyframes slideUp     { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes fadeIn      { from{opacity:0} to{opacity:1} }
@keyframes heroFadeIn  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* Page header */
.page-header {
  background: linear-gradient(135deg, rgba(1,51,105,.55) 0%, rgba(0,0,0,0) 60%, rgba(213,10,10,.2) 100%);
  border-bottom: 1px solid rgba(1,51,105,.35);
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
}
.page-header-left { display: flex; align-items: center; gap: 10px; }
.nfl-shield {
  width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--nfl-blue), var(--nfl-red));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.page-title { font-size: 14px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.page-sub { font-size: 9px; color: var(--text-muted); margin-top: 1px; }
.live-badge {
  display: flex; align-items: center; gap: 5px;
  background: rgba(213,10,10,.15); border: 1px solid rgba(213,10,10,.3);
  border-radius: 20px; padding: 4px 10px;
  font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #ff6b6b;
}
.live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--nfl-red); animation: blink .8s ease-in-out infinite; }

/* Tab bar */
.tab-bar {
  display: flex; background: rgba(255,255,255,.02);
  border-bottom: 1px solid var(--border); padding: 0 14px; gap: 2px; overflow-x: auto;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 9px 13px; font-size: 9px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-muted); cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  background: none; border-top: none; border-left: none; border-right: none;
  transition: color .12s, border-color .12s;
}
.tab-btn:hover { color: var(--text-dim); }
.tab-btn.active { color: var(--nfl-gold); border-bottom-color: var(--nfl-gold); }

/* Tab panels */
.panel { display: none; }
.panel.active { display: block; }

/* Loading / error states */
.state-msg { text-align: center; padding: 40px 20px; font-size: 12px; color: var(--text-muted); }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--nfl-gold); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px; }

/* HERO GAME */
.hero-game { position: relative; overflow: hidden; min-height: 185px; background: var(--bg); }
.hero-bg { position: absolute; inset: 0; z-index: 0; transition: background 1s ease; }
.hero-field-lines {
  position: absolute; inset: 0; z-index: 0; opacity: .06;
  background-image: repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(255,255,255,1) 30px);
}
.hero-label {
  position: absolute; top: 10px; left: 12px; z-index: 3;
  font-size: 7px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--nfl-gold); background: rgba(0,0,0,.55); border-radius: 4px; padding: 2px 9px;
}
.hero-quarter {
  position: absolute; top: 10px; right: 12px; z-index: 3;
  font-size: 8px; font-weight: 700; color: var(--nfl-gold);
  background: rgba(255,182,18,.1); border: 1px solid rgba(255,182,18,.25);
  border-radius: 4px; padding: 2px 8px;
}
.hero-matchup {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  padding: 28px 16px 12px;
}
.hero-team { text-align: center; }
.hero-logo {
  width: 64px; height: 64px; border-radius: 50%;
  margin: 0 auto 7px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.1);
  overflow: hidden; cursor: pointer;
  filter: drop-shadow(0 4px 14px rgba(0,0,0,.6));
  animation: logoEntrance .6s cubic-bezier(.34,1.56,.64,1) both;
}
.hero-logo img { width: 100%; height: 100%; object-fit: contain; }
.hero-abbr { font-size: 14px; font-weight: 900; letter-spacing: .04em; cursor: pointer; }
.hero-abbr:hover { color: var(--nfl-gold); }
.hero-fullname { font-size: 8px; color: var(--text-dim); margin-top: 1px; }
.hero-record { font-size: 8px; color: var(--text-muted); margin-top: 1px; }
.hero-score-block { text-align: center; }
.hero-score { display: flex; align-items: center; justify-content: center; gap: 8px; }
.hero-pts { font-size: 44px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.hero-pts.lead { color: #fff; text-shadow: 0 0 20px rgba(255,255,255,.15); }
.hero-pts.trail { color: rgba(255,255,255,.3); }
.hero-pts.pending { font-size: 13px; color: var(--text-muted); font-weight: 500; margin: 12px 0; }
.hero-sep { font-size: 14px; color: rgba(255,255,255,.2); font-weight: 700; }
.hero-status { font-size: 8px; color: rgba(255,255,255,.4); text-align: center; margin-top: 5px; letter-spacing: .04em; }
.hero-status.live { color: var(--nfl-gold); }
.hero-dots { display: flex; justify-content: center; gap: 5px; padding: 8px 0 10px; position: relative; z-index: 2; }
.hero-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.2); cursor: pointer; transition: all .25s; }
.hero-dot.active { background: var(--nfl-gold); width: 14px; border-radius: 3px; }
.hero-live-badge {
  position: absolute; top: 10px; right: 12px; z-index: 3;
  background: rgba(213,10,10,.9); color: #fff;
  font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  border-radius: 4px; padding: 3px 8px; animation: pulse-red 1.6s ease-in-out infinite;
}

/* Game list */
.game-list { padding: 10px 12px 40px; max-width: 900px; margin: 0 auto; }
.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.week-label { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.week-btns { display: flex; gap: 5px; }
.week-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 5px; padding: 3px 9px;
  font-size: 9px; cursor: pointer; font-weight: 600; transition: background .12s;
}
.week-btn:hover { background: rgba(255,255,255,.08); }
.week-btn:disabled { opacity: .3; cursor: default; }
.day-label {
  font-size: 7px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-muted); margin: 10px 0 5px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.game-card {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 8px 10px; margin-bottom: 5px;
  cursor: pointer; transition: background .12s, border-color .12s; position: relative; overflow: hidden;
}
.game-card:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); }
.game-card.live-card { border-color: rgba(255,182,18,.15); }
.live-accent {
  position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: linear-gradient(180deg, var(--nfl-gold), var(--nfl-red));
  border-radius: 2px 0 0 2px; animation: barPulse 2s ease-in-out infinite;
}
.gc-team { display: flex; align-items: center; gap: 6px; flex: 1; }
.gc-team.away { flex-direction: row-reverse; text-align: right; }
.team-logo-sm {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.team-logo-sm img { width: 100%; height: 100%; object-fit: contain; }
.gc-name { font-size: 11px; font-weight: 800; }
.gc-record { font-size: 7px; color: var(--text-muted); margin-top: 1px; }
.score-center { text-align: center; min-width: 62px; }
.score-nums { display: flex; align-items: center; justify-content: center; gap: 4px; }
.sn { font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
.sn.w { color: #fff; } .sn.l { color: rgba(255,255,255,.3); }
.score-sep { font-size: 8px; color: rgba(255,255,255,.2); }
.score-live { font-size: 7px; color: var(--nfl-gold); font-weight: 700; margin-top: 2px; }
.score-final { font-size: 7px; color: var(--text-muted); margin-top: 2px; }
.score-time { font-size: 8px; color: var(--text-dim); }
.odds-row {
  display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
  padding: 5px 10px 7px; border-top: 1px solid var(--border);
  font-size: 8px; color: var(--text-muted);
}
.odds-badge { background: rgba(255,255,255,.05); border-radius: 3px; padding: 2px 7px; }

/* Team detail modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.72); backdrop-filter: blur(5px);
  animation: fadeIn .2s ease both;
}
.team-modal {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 101;
  background: #11111e; border-radius: 18px 18px 0 0;
  max-height: 80vh; overflow-y: auto;
  animation: slideUp .3s cubic-bezier(.34,1.1,.64,1) both;
  border: 1px solid rgba(255,255,255,.1); border-bottom: none;
}
.modal-hero { position: relative; padding: 24px 18px 16px; overflow: hidden; }
.modal-hero-bg { position: absolute; inset: 0; z-index: 0; opacity: .12; }
.modal-close {
  position: absolute; top: 12px; right: 14px; z-index: 2;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
  color: rgba(255,255,255,.5); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-team-row { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
.modal-logo {
  width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.12);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.modal-logo img { width: 100%; height: 100%; object-fit: contain; }
.modal-team-name { font-size: 20px; font-weight: 900; }
.modal-record { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
.modal-seed { display: inline-block; background: rgba(34,197,94,.15); color: var(--win); font-size: 8px; font-weight: 800; border-radius: 4px; padding: 2px 7px; margin-top: 5px; }
.modal-body { padding: 0 16px 28px; }
.modal-section { margin-top: 16px; }
.modal-section-title { font-size: 8px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.3); margin-bottom: 8px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
.stat-tile-label { font-size: 8px; color: var(--text-muted); margin-bottom: 3px; }
.stat-tile-val { font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat-tile-val.good { color: var(--nfl-gold); } .stat-tile-val.bad { color: var(--loss); }
.form-row { display: flex; gap: 4px; margin-top: 5px; }
.form-tile { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 4px; text-align: center; }
.form-result { font-size: 11px; font-weight: 900; } .form-result.w { color: var(--win); } .form-result.l { color: var(--loss); }
.form-opp { font-size: 7px; color: var(--text-muted); margin-top: 2px; }
.form-score { font-size: 7px; color: rgba(255,255,255,.3); margin-top: 1px; font-variant-numeric: tabular-nums; }
.player-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 5px; }
.player-headshot { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.07); border: 1px solid var(--border); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.player-headshot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.player-info { flex: 1; }
.player-name { font-size: 11px; font-weight: 700; }
.player-pos { font-size: 8px; color: var(--text-muted); margin-top: 1px; }
.player-stat { font-size: 10px; font-weight: 800; color: var(--nfl-gold); }
.injury-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(239,68,68,.06); border: 1px solid rgba(239,68,68,.1); border-radius: 7px; margin-bottom: 4px; }
.injury-name { font-size: 10px; font-weight: 600; }
.injury-pos { font-size: 8px; color: var(--text-muted); margin-top: 1px; }
.inj-badge { font-size: 7px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .06em; }
.inj-out { background: rgba(239,68,68,.2); color: var(--loss); }
.inj-d   { background: rgba(249,115,22,.15); color: #f97316; }
.inj-q   { background: rgba(255,182,18,.12); color: var(--nfl-gold); }
.inj-lp  { background: rgba(34,197,94,.1); color: var(--win); }

/* Stub */
.stub { text-align: center; padding: 60px 20px; font-size: 12px; color: var(--text-muted); }
.stub .icon { font-size: 36px; margin-bottom: 10px; }
.stub h3 { font-size: 14px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }

/* Fantasy */
.not-configured { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 16px; }
.not-configured h3 { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.not-configured p { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.not-configured a { color: var(--nfl-gold); }
.matchup-hero { background: linear-gradient(135deg, rgba(1,51,105,.3), rgba(213,10,10,.15)); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.matchup-hero-title { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; text-align: center; }
.matchup-teams { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.matchup-team { flex: 1; text-align: center; }
.matchup-team-name { font-size: 11px; font-weight: 700; margin-bottom: 4px; color: var(--text-dim); }
.matchup-pts { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
.matchup-pts.leading { color: var(--win); } .matchup-pts.trailing { color: var(--text-muted); } .matchup-pts.tied { color: var(--text); }
.matchup-vs { font-size: 11px; color: var(--text-muted); font-weight: 700; flex-shrink: 0; }
.team-input-wrap { margin-top: 12px; text-align: center; }
.team-input-wrap input { background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 10px; color: var(--text); width: 200px; text-align: center; outline: none; }
.team-input-wrap input:focus { border-color: var(--nfl-gold); }
.team-input-wrap .hint { font-size: 9px; color: var(--text-muted); margin-top: 4px; }
.standings-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.standings-table th { font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); padding: 3px 8px; text-align: right; }
.standings-table th:first-child { text-align: left; }
.standings-table td { font-size: 10px; padding: 6px 8px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.04); }
.standings-table td:first-child { text-align: left; font-weight: 600; }
.standings-table tr:last-child td { border-bottom: none; }
.section-head { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin: 16px 0 8px; }

/* Pick'em */
.pickem-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.pickem-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.pickem-deadline { font-size: 10px; color: var(--nfl-gold); }
.pick-card { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 10px; margin-bottom: 6px; }
.pick-btn { padding: 8px 6px; border-radius: 7px; border: 2px solid var(--border); background: transparent; color: var(--text); font-size: 10px; font-weight: 700; cursor: pointer; text-align: center; transition: all .15s; line-height: 1.3; display: flex; align-items: center; justify-content: center; gap: 5px; flex-direction: column; }
.pick-btn:hover { border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.05); }
.pick-btn.selected { background: rgba(1,51,105,.45); border-color: #4a6fa5; color: #fff; }
.pick-btn.locked { cursor: default; }
.pick-btn.correct { background: rgba(34,197,94,.15); border-color: var(--win); }
.pick-btn.incorrect { background: rgba(239,68,68,.1); border-color: var(--loss); opacity: .6; }
.pick-btn-logo { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; }
.pick-btn-logo img { width: 100%; height: 100%; object-fit: contain; }
.pick-meta { text-align: center; }
.pick-time { font-size: 9px; color: var(--text-muted); }
.pick-spread { font-size: 9px; color: var(--text-dim); margin-top: 2px; }
.submit-row { margin: 12px 0; text-align: center; }
.submit-btn { background: var(--nfl-blue); color: #fff; border: none; border-radius: 8px; padding: 10px 28px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: background .15s; }
.submit-btn:hover { background: #024080; }
.submit-btn:disabled { opacity: .4; cursor: default; }
.lb-section { margin-top: 20px; }
.lb-section h4 { font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
.lb-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; margin-bottom: 4px; font-size: 10px; }
.lb-rank { font-weight: 800; color: var(--text-muted); width: 18px; flex-shrink: 0; }
.lb-rank.gold { color: var(--nfl-gold); }
.lb-name { flex: 1; font-weight: 600; }
.lb-record { font-weight: 700; }
.lb-season { color: var(--text-muted); font-size: 9px; margin-left: 4px; }

/* Standings tab */
.conf-header { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--nfl-gold); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.conf-header::after { content:''; flex:1; height:1px; background: rgba(255,182,18,.2); }
.div-header { font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin: 10px 0 4px; }
.nfl-standings-table { width: 100%; border-collapse: collapse; }
.nfl-standings-table th { font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); padding: 3px 6px; text-align: right; }
.nfl-standings-table th:first-child { text-align: left; }
.nfl-standings-table td { font-size: 10px; padding: 5px 6px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.04); }
.nfl-standings-table td:first-child { text-align: left; font-weight: 600; }
.nfl-standings-table tr:last-child td { border-bottom: none; }
.seed-badge { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 3px; font-size: 8px; font-weight: 800; background: rgba(34,197,94,.15); color: var(--win); margin-right: 5px; vertical-align: middle; }
.elim { color: var(--text-muted); }
.streak-w { color: var(--win); font-weight: 700; } .streak-l { color: var(--loss); font-weight: 700; }
.std-team-logo { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,.06); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; margin-right: 5px; }
.std-team-logo img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-header-left">
    <div class="nfl-shield">🏈</div>
    <div>
      <div class="page-title">NFL Hub</div>
      <div class="page-sub" id="season-label">Loading…</div>
    </div>
  </div>
  <div class="live-badge" id="live-count-badge" style="display:none">
    <div class="live-dot"></div><span id="live-count-text">0 Live</span>
  </div>
</div>

<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" onclick="switchTab('scores',this)">Scores</button>
  <button class="tab-btn"        onclick="switchTab('fantasy',this)">Fantasy</button>
  <button class="tab-btn"        onclick="switchTab('pickem',this)">Pick'em</button>
  <button class="tab-btn"        onclick="switchTab('standings',this)">Standings</button>
</div>

<!-- SCORES PANEL -->
<div class="panel active" id="panel-scores">
  <div class="hero-game" id="heroGame">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-field-lines"></div>
    <div class="hero-label" id="heroLabel">Loading…</div>
    <div class="hero-matchup" id="heroMatchup">
      <div class="hero-team" id="heroAway"></div>
      <div class="hero-score-block" id="heroScoreBlock"></div>
      <div class="hero-team" id="heroHome"></div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>
  <div class="game-list">
    <div class="state-msg" id="scores-loading"><div class="spinner"></div>Loading scoreboard…</div>
    <div id="scores-content" style="display:none">
      <div class="week-nav">
        <span class="week-label" id="week-label-text">Week —</span>
        <div class="week-btns">
          <button class="week-btn" id="btn-prev" onclick="changeWeek(-1)">◀ Prev</button>
          <button class="week-btn" id="btn-next" onclick="changeWeek(1)">Next ▶</button>
        </div>
      </div>
      <div id="games-list"></div>
    </div>
  </div>
</div>

<!-- FANTASY PANEL -->
<div class="panel" id="panel-fantasy">
  <div class="state-msg" id="fantasy-loading" style="display:none"><div class="spinner"></div>Loading fantasy…</div>
  <div id="fantasy-content" style="padding:14px"></div>
</div>

<!-- PICK'EM PANEL -->
<div class="panel" id="panel-pickem">
  <div class="state-msg" id="pickem-loading" style="display:none"><div class="spinner"></div>Loading picks…</div>
  <div id="pickem-content" style="padding:14px"></div>
</div>

<!-- STANDINGS PANEL -->
<div class="panel" id="panel-standings">
  <div class="state-msg" id="standings-loading" style="display:none"><div class="spinner"></div>Loading standings…</div>
  <div id="standings-content" style="padding:14px"></div>
</div>

<!-- TEAM MODAL -->
<div id="modalOverlay" class="modal-overlay" style="display:none" onclick="closeModal()"></div>
<div id="teamModal" class="team-modal" style="display:none">
  <div class="modal-hero" id="modalHero">
    <div class="modal-hero-bg" id="modalHeroBg"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-team-row" id="modalTeamRow"></div>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>

<script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
<script>
// Globals
let _config = {};
let _currentWeek = null;
let _currentSeason = 2024;
let _viewWeek = null;
let _pollTimer = null;
let _heroTimer = null;
let _heroGames = [];
let _heroIdx = 0;
let _allGames = [];
let _oddsCache = {};
let _fantasyLoaded = false, _pickemLoaded = false, _standingsLoaded = false;
let _savedTeam = '';
let _picksCache = {};
function _picksKey() { return `${_currentSeason}-${_viewWeek}`; }
function _getPicks() { return _picksCache[_picksKey()] || {}; }
function _setPicks(p) { _picksCache[_picksKey()] = p; }

const TEAM_COLORS = {
  ARI:'#97233F',ARZ:'#97233F',ATL:'#A71930',BAL:'#241773',BUF:'#00338D',CAR:'#0085CA',
  CHI:'#0B162A',CIN:'#FB4F14',CLE:'#311D00',DAL:'#003594',DEN:'#FB4F14',DET:'#0076B6',
  GB:'#203731',HOU:'#03202F',IND:'#002C5F',JAC:'#006778',JAX:'#006778',KC:'#E31837',
  LAC:'#0080C6',LAR:'#003594',LV:'#000000',MIA:'#008E97',MIN:'#4F2683',NE:'#002244',
  NO:'#D3BC8D',NYG:'#0B2265',NYJ:'#125740',PHI:'#004C97',PIT:'#FFB612',SEA:'#002244',
  SF:'#AA0000',TB:'#D50A0A',TEN:'#4B92DB',WAS:'#5A1414',WSH:'#5A1414',
};

function teamLogoUrl(abbr) {
  return Dissent.imageUrl(`https://a.espncdn.com/i/teamlogos/nfl/500/${(abbr||'').toLowerCase()}.png`);
}

function logoImg(abbr, cls, clickFn) {
  const fn = clickFn ? ` onclick="${clickFn}"` : '';
  return `<div class="${cls}"${fn}><img src="${teamLogoUrl(abbr)}" alt="${esc(abbr)}" onerror="this.parentNode.innerHTML='🏈'"></div>`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
}
function daySlot(isoStr) {
  const d = new Date(isoStr);
  const day = d.toLocaleDateString('en-US', { weekday: 'long', timeZone: 'America/New_York' });
  const h = parseInt(d.toLocaleTimeString('en-US', { hour: 'numeric', hour12: false, timeZone: 'America/New_York' }));
  if (day === 'Thursday') return 'Thursday Night Football';
  if (day === 'Sunday') {
    if (h < 15) return 'Sunday · 1:00 PM ET';
    if (h < 17) return 'Sunday · 4:25 PM ET';
    return 'Sunday Night Football';
  }
  if (day === 'Monday') return 'Monday Night Football';
  return `${day} · ${fmtTime(isoStr)}`;
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab !== 'scores') { clearInterval(_pollTimer); clearInterval(_heroTimer); }
  if (tab === 'fantasy'   && !_fantasyLoaded)   { _fantasyLoaded   = true; loadFantasy(); }
  if (tab === 'pickem'    && !_pickemLoaded)    { _pickemLoaded    = true; loadPickem(); }
  if (tab === 'standings' && !_standingsLoaded) { _standingsLoaded = true; loadStandings(); }
  if (tab === 'scores') loadScores(_viewWeek);
}

async function fetchScoreboard(week) {
  const url = week
    ? `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=${week}`
    : 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
  const res = await Dissent.fetch(url);
  return JSON.parse(res.body);
}

function parseGames(data) {
  return (data.events ?? []).map(ev => {
    const comp = ev.competitions?.[0] ?? {};
    const away = comp.competitors?.find(c => c.homeAway === 'away') ?? {};
    const home = comp.competitors?.find(c => c.homeAway === 'home') ?? {};
    const status = ev.status?.type?.name ?? 'STATUS_SCHEDULED';
    const completed = ev.status?.type?.completed ?? false;
    const period = ev.status?.period ?? 0;
    const clock = ev.status?.displayClock ?? '';
    return {
      id: ev.id, date: ev.date, slot: daySlot(ev.date),
      away: { abbr: away.team?.abbreviation ?? '?', name: away.team?.displayName ?? '?', shortName: away.team?.shortDisplayName ?? '?', score: away.score ?? '0', record: away.records?.[0]?.summary ?? '' },
      home: { abbr: home.team?.abbreviation ?? '?', name: home.team?.displayName ?? '?', shortName: home.team?.shortDisplayName ?? '?', score: home.score ?? '0', record: home.records?.[0]?.summary ?? '' },
      status, completed, period, clock,
      isLive: status === 'STATUS_IN_PROGRESS' || status === 'STATUS_HALFTIME',
      isFinal: completed,
    };
  });
}

function buildHeroGames(games) {
  const live = games.filter(g => g.isLive);
  if (live.length > 0) return live;
  const upcoming = games.filter(g => !g.isFinal).slice(0, 5);
  if (upcoming.length > 0) return upcoming;
  return games.slice(0, 3);
}

function renderHero(game) {
  const away = game.away, home = game.home;
  const awayColor = TEAM_COLORS[away.abbr] || '#013369';
  const homeColor = TEAM_COLORS[home.abbr] || '#D50A0A';
  document.getElementById('heroBg').style.background =
    `linear-gradient(135deg, ${awayColor}55 0%, rgba(10,10,20,.9) 45%, ${homeColor}44 100%)`;
  document.getElementById('heroLabel').textContent = game.slot;

  const lbExisting = document.getElementById('heroGame').querySelector('.hero-live-badge');
  if (lbExisting) lbExisting.remove();
  const qExisting = document.getElementById('heroGame').querySelector('.hero-quarter');
  if (qExisting) qExisting.remove();

  if (game.isLive) {
    const lb = document.createElement('div'); lb.className = 'hero-live-badge'; lb.textContent = '● LIVE';
    document.getElementById('heroGame').appendChild(lb);
    const q = document.createElement('div'); q.className = 'hero-quarter'; q.textContent = `Q${game.period} · ${game.clock}`;
    document.getElementById('heroGame').appendChild(q);
  } else if (!game.isFinal) {
    const q = document.createElement('div'); q.className = 'hero-quarter'; q.textContent = fmtTime(game.date);
    document.getElementById('heroGame').appendChild(q);
  }

  document.getElementById('heroAway').innerHTML =
    logoImg(away.abbr, 'hero-logo', `openModal('${esc(away.abbr)}')`) +
    `<div class="hero-abbr" onclick="openModal('${esc(away.abbr)}')">${esc(away.abbr)}</div>` +
    `<div class="hero-fullname">${esc(away.shortName)}</div><div class="hero-record">${esc(away.record)}</div>`;
  document.getElementById('heroHome').innerHTML =
    logoImg(home.abbr, 'hero-logo', `openModal('${esc(home.abbr)}')`) +
    `<div class="hero-abbr" onclick="openModal('${esc(home.abbr)}')">${esc(home.abbr)}</div>` +
    `<div class="hero-fullname">${esc(home.shortName)}</div><div class="hero-record">${esc(home.record)}</div>`;

  const awayPts = parseInt(away.score)||0, homePts = parseInt(home.score)||0;
  let scoreHtml = '';
  if (game.isLive || game.isFinal) {
    const awayClass = awayPts >= homePts ? 'lead' : 'trail';
    const homeClass = homePts >= awayPts ? 'lead' : 'trail';
    scoreHtml = `<div class="hero-score"><span class="hero-pts ${awayClass}">${esc(away.score)}</span><span class="hero-sep">–</span><span class="hero-pts ${homeClass}">${esc(home.score)}</span></div>`;
    const statusText = game.isLive
      ? (awayPts > homePts ? `${away.abbr} leads` : homePts > awayPts ? `${home.abbr} leads` : 'Tied')
      : 'Final';
    scoreHtml += `<div class="hero-status${game.isLive ? ' live' : ''}">${esc(statusText)}</div>`;
  } else {
    scoreHtml = `<div class="hero-pts pending">${fmtTime(game.date)}</div>`;
  }
  document.getElementById('heroScoreBlock').innerHTML = scoreHtml;
}

function renderDots(games, currentIdx) {
  document.getElementById('heroDots').innerHTML = games.map((_,i) =>
    `<div class="hero-dot${i===currentIdx?' active':''}" onclick="jumpHero(${i})"></div>`).join('');
}

function jumpHero(idx) {
  _heroIdx = idx; clearInterval(_heroTimer);
  renderHero(_heroGames[_heroIdx]); renderDots(_heroGames, _heroIdx); startHeroRotation();
}

function startHeroRotation() {
  if (_heroGames.length <= 1) return;
  _heroTimer = setInterval(() => {
    _heroIdx = (_heroIdx + 1) % _heroGames.length;
    renderHero(_heroGames[_heroIdx]); renderDots(_heroGames, _heroIdx);
  }, 30000);
}

async function loadScores(week) {
  clearInterval(_pollTimer); clearInterval(_heroTimer);
  document.getElementById('scores-loading').style.display = 'block';
  document.getElementById('scores-content').style.display = 'none';
  try {
    // First call: fetch without week to get current season/week context,
    // then re-fetch with explicit week to get the full regular-season schedule.
    // (ESPN returns only spring/preseason games when no week param is given in offseason.)
    if (!week) {
      const ctx = await fetchScoreboard(null);
      _currentWeek = ctx.week?.number ?? 1;
      _currentSeason = ctx.season?.year ?? 2024;
      _viewWeek = _currentWeek;
      week = _currentWeek;
    }
    const data = await fetchScoreboard(week);
    document.getElementById('season-label').textContent = `${_currentSeason} · Week ${_viewWeek}`;
    document.getElementById('week-label-text').textContent = `Week ${_viewWeek}`;
    document.getElementById('btn-prev').disabled = _viewWeek <= 1;
    document.getElementById('btn-next').disabled = _viewWeek >= 18;
    const games = parseGames(data);
    _allGames = games;
    const liveCount = games.filter(g => g.isLive).length;
    const badge = document.getElementById('live-count-badge');
    badge.style.display = liveCount > 0 ? 'flex' : 'none';
    document.getElementById('live-count-text').textContent = `${liveCount} Live`;
    _heroGames = buildHeroGames(games); _heroIdx = 0;
    renderHero(_heroGames[0]); renderDots(_heroGames, 0); startHeroRotation();
    if (_config.odds_api_key) await fetchOdds(games);
    renderGameList(games);
    document.getElementById('scores-loading').style.display = 'none';
    document.getElementById('scores-content').style.display = 'block';
    const hasLive = games.some(g => g.isLive);
    _pollTimer = setInterval(() => loadScores(_viewWeek), hasLive ? 60000 : 300000);
  } catch(e) {
    document.getElementById('scores-loading').innerHTML = `<div class="state-msg">Failed to load scoreboard.</div>`;
  }
}

function changeWeek(delta) {
  _viewWeek = Math.max(1, Math.min(18, (_viewWeek||_currentWeek) + delta));
  loadScores(_viewWeek);
}

function renderGameList(games) {
  const el = document.getElementById('games-list');
  const bySlot = {};
  games.forEach(g => { (bySlot[g.slot] = bySlot[g.slot] || []).push(g); });
  const slotOrder = ['Thursday Night Football','Sunday · 1:00 PM ET','Sunday · 4:25 PM ET','Sunday Night Football','Monday Night Football'];
  const keys = [...new Set([...slotOrder.filter(s => bySlot[s]), ...Object.keys(bySlot).filter(k => !slotOrder.includes(k))])];
  el.innerHTML = keys.map(slot =>
    `<div class="day-label">${esc(slot)}</div>${bySlot[slot].map(g => renderGameCard(g)).join('')}`
  ).join('');
}

function renderGameCard(g) {
  const odds = _oddsCache[g.id];
  let centerHtml = '';
  if (g.isLive) {
    const ap = parseInt(g.away.score)||0, hp = parseInt(g.home.score)||0;
    centerHtml = `<div class="score-nums"><span class="sn ${ap>=hp?'w':'l'}">${esc(g.away.score)}</span><span class="score-sep">–</span><span class="sn ${hp>=ap?'w':'l'}">${esc(g.home.score)}</span></div><div class="score-live">Q${g.period} · ${esc(g.clock)}</div>`;
  } else if (g.isFinal) {
    const ap = parseInt(g.away.score)||0, hp = parseInt(g.home.score)||0;
    centerHtml = `<div class="score-nums"><span class="sn ${ap>=hp?'w':'l'}">${esc(g.away.score)}</span><span class="score-sep">–</span><span class="sn ${hp>=ap?'w':'l'}">${esc(g.home.score)}</span></div><div class="score-final">Final</div>`;
  } else {
    centerHtml = `<div class="score-time">${fmtTime(g.date)}</div>`;
  }
  const oddsHtml = odds ? `<div class="odds-row"><span class="odds-badge">Spread: ${esc(odds.spread)}</span><span class="odds-badge">O/U: ${esc(odds.ou)}</span></div>` : '';
  return `<div class="game-card${g.isLive?' live-card':''}">
    ${g.isLive?'<div class="live-accent"></div>':''}
    <div class="gc-team"${g.isLive?' style="padding-left:6px"':''}>
      ${logoImg(g.away.abbr,'team-logo-sm',`openModal('${esc(g.away.abbr)}')`)}
      <div><div class="gc-name" style="cursor:pointer" onclick="openModal('${esc(g.away.abbr)}')">${esc(g.away.abbr)}</div><div class="gc-record">${esc(g.away.record)}</div></div>
    </div>
    <div class="score-center">${centerHtml}</div>
    <div class="gc-team away"${g.isLive?' style="padding-right:6px"':''}>
      ${logoImg(g.home.abbr,'team-logo-sm',`openModal('${esc(g.home.abbr)}')`)}
      <div><div class="gc-name" style="cursor:pointer" onclick="openModal('${esc(g.home.abbr)}')">${esc(g.home.abbr)}</div><div class="gc-record">${esc(g.home.record)}</div></div>
    </div>
    ${oddsHtml ? `</div><div style="padding:0 10px">${oddsHtml}` : ''}
  </div>`;
}

async function fetchOdds(games) {
  try {
    const url = `https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds/?apiKey=${encodeURIComponent(_config.odds_api_key)}&regions=us&markets=spreads,totals`;
    const res = await Dissent.fetch(url);
    const data = JSON.parse(res.body);
    (data||[]).forEach(ev => {
      const spread = ev.bookmakers?.[0]?.markets?.find(m=>m.key==='spreads')?.outcomes?.[0]?.point;
      const ou = ev.bookmakers?.[0]?.markets?.find(m=>m.key==='totals')?.outcomes?.[0]?.point;
      if (spread!==undefined||ou!==undefined) _oddsCache[ev.id]={spread:spread??'—',ou:ou??'—'};
    });
  } catch(_) {}
}

// Team detail modal
let _modalOpen = false;

async function openModal(abbr) {
  _modalOpen = true;
  document.getElementById('modalOverlay').style.display = 'block';
  document.getElementById('teamModal').style.display = 'block';
  document.getElementById('modalBody').innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading…</div>';
  document.getElementById('modalTeamRow').innerHTML = '';
  const color = TEAM_COLORS[abbr] || '#013369';
  document.getElementById('modalHeroBg').style.background = color;
  const game = _allGames.find(g => g.away.abbr === abbr || g.home.abbr === abbr);
  document.getElementById('modalTeamRow').innerHTML =
    `<div class="modal-logo"><img src="${teamLogoUrl(abbr)}" alt="${esc(abbr)}" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:contain"></div>` +
    `<div><div class="modal-team-name">${esc(abbr)}</div><div class="modal-record" id="modalRecord">Loading…</div></div>`;
  try {
    const stData = await Dissent.fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/standings');
    const stJson = JSON.parse(stData.body);
    let record = '', seed = null, teamId = '';
    (stJson.children||[]).forEach(conf => (conf.children||[]).forEach(div =>
      (div.standings?.entries||[]).forEach(entry => {
        if ((entry.team?.abbreviation||'').toUpperCase() === abbr.toUpperCase()) {
          record = entry.stats?.find(s=>s.name==='overall')?.displayValue||'';
          seed = entry.stats?.find(s=>s.name==='playoffSeed')?.displayValue||null;
          teamId = entry.team?.id||'';
        }
      })
    ));
    document.getElementById('modalRecord').textContent = record;
    if (seed && parseInt(seed)<=7) {
      document.getElementById('modalRecord').insertAdjacentHTML('afterend',`<div class="modal-seed">🌱 #${esc(seed)} Seed</div>`);
    }

    let liveStatsHtml = '';
    if (game && game.isLive) {
      try {
        const sumData = await Dissent.fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${game.id}`);
        const sumJson = JSON.parse(sumData.body);
        const teamStats = (sumJson.boxscore?.teams||[]).find(t=>(t.team?.abbreviation||'').toUpperCase()===abbr.toUpperCase());
        if (teamStats) {
          const stat = name => teamStats.statistics?.find(s=>s.name===name)?.displayValue||'—';
          liveStatsHtml = `<div class="modal-section"><div class="modal-section-title">⚡ Live game stats</div><div class="stat-grid">
            <div class="stat-tile"><div class="stat-tile-label">Passing Yds</div><div class="stat-tile-val">${esc(stat('passingYards'))}</div></div>
            <div class="stat-tile"><div class="stat-tile-label">Rushing Yds</div><div class="stat-tile-val">${esc(stat('rushingYards'))}</div></div>
            <div class="stat-tile"><div class="stat-tile-label">3rd Down</div><div class="stat-tile-val good">${esc(stat('thirdDownEff'))}</div></div>
            <div class="stat-tile"><div class="stat-tile-label">Turnovers</div><div class="stat-tile-val${parseInt(stat('turnovers'))||0>0?' bad':''}">${esc(stat('turnovers'))}</div></div>
          </div></div>`;
          const players = [];
          (sumJson.boxscore?.players||[]).forEach(side => {
            if ((side.team?.abbreviation||'').toUpperCase()!==abbr.toUpperCase()) return;
            (side.statistics||[]).forEach(sg => {
              if (!['passing','rushing','receiving'].includes(sg.name)) return;
              (sg.athletes||[]).slice(0,1).forEach(a => {
                const statStr = (sg.keys||[]).slice(0,3).map((k,i)=>`${k}:${a.stats?.[i]||'—'}`).join(' · ');
                players.push({name:a.athlete?.displayName||'?',pos:a.athlete?.position?.abbreviation||'',id:a.athlete?.id,stat:statStr});
              });
            });
          });
          if (players.length>0) {
            liveStatsHtml += `<div class="modal-section"><div class="modal-section-title">Key players</div>`+
              players.slice(0,3).map(p=>`<div class="player-row">
                <div class="player-headshot"><img src="${Dissent.imageUrl(`https://a.espncdn.com/i/headshots/nfl/players/full/${esc(p.id)}.png`)}" alt="${esc(p.name)}" onerror="this.parentNode.innerHTML='🧑'"></div>
                <div class="player-info"><div class="player-name">${esc(p.name)}</div><div class="player-pos">${esc(p.pos)}</div></div>
                <div class="player-stat">${esc(p.stat)}</div>
              </div>`).join('')+`</div>`;
          }
        }
      } catch(_) {}
    }

    let formHtml = '';
    try {
      if (teamId) {
        const schData = await Dissent.fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/${teamId}/schedule`);
        const schJson = JSON.parse(schData.body);
        const last5 = (schJson.events||[]).filter(e=>e.competitions?.[0]?.status?.type?.completed).slice(-5);
        if (last5.length>0) {
          formHtml = `<div class="modal-section"><div class="modal-section-title">Last 5 games</div><div class="form-row">`+
            last5.map(e => {
              const comp = e.competitions?.[0]??{};
              const myTeam = comp.competitors?.find(c=>(c.team?.abbreviation||'').toUpperCase()===abbr.toUpperCase());
              const opp = comp.competitors?.find(c=>(c.team?.abbreviation||'').toUpperCase()!==abbr.toUpperCase());
              const won = myTeam?.winner??false;
              const ha = myTeam?.homeAway==='home'?'vs':'at';
              return `<div class="form-tile"><div class="form-result ${won?'w':'l'}">${won?'W':'L'}</div><div class="form-opp">${esc(ha)} ${esc(opp?.team?.abbreviation||'?')}</div><div class="form-score">${esc(myTeam?.score||'0')}–${esc(opp?.score||'0')}</div></div>`;
            }).join('')+`</div></div>`;
        }
      }
    } catch(_) {}

    let injuryHtml = '';
    try {
      const injData = await Dissent.fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries');
      const injJson = JSON.parse(injData.body);
      const teamInj = (injJson.injuries||[]).find(t=>(t.team?.abbreviation||'').toUpperCase()===abbr.toUpperCase());
      const entries = (teamInj?.injuries||[]).filter(i=>['Out','Doubtful','Questionable'].includes(i.status));
      if (entries.length>0) {
        injuryHtml = `<div class="modal-section"><div class="modal-section-title">Injury report</div>`+
          entries.slice(0,6).map(i => {
            const cls = i.status==='Out'?'inj-out':i.status==='Doubtful'?'inj-d':'inj-q';
            return `<div class="injury-row"><div><div class="injury-name">${esc(i.athlete?.displayName||'?')}</div><div class="injury-pos">${esc(i.athlete?.position?.abbreviation||'')} · ${esc(i.shortComment||'')}</div></div><div class="inj-badge ${cls}">${esc(i.status)}</div></div>`;
          }).join('')+`</div>`;
      }
    } catch(_) {}

    document.getElementById('modalBody').innerHTML = (liveStatsHtml + formHtml + injuryHtml) ||
      '<div style="padding:20px;text-align:center;font-size:11px;color:rgba(255,255,255,.3)">No additional data available.</div>';
  } catch(e) {
    document.getElementById('modalBody').innerHTML = `<div class="state-msg">Failed to load team data.</div>`;
  }
}

function closeModal() {
  _modalOpen = false;
  document.getElementById('modalOverlay').style.display = 'none';
  document.getElementById('teamModal').style.display = 'none';
}

// Fantasy tab
async function loadFantasy() {
  const content = document.getElementById('fantasy-content');
  const leagueId = _config.sleeper_league_id;
  if (!leagueId) {
    content.innerHTML = `<div class="not-configured"><h3>Sleeper Fantasy Integration</h3><p>An admin needs to set the <strong>Sleeper League ID</strong>. Right-click the channel → <strong>Manage Plugin</strong> → Plugin Settings.</p></div>`;
    return;
  }
  document.getElementById('fantasy-loading').style.display = 'block';
  try {
    const [leagueRes, matchupRes, trendRes] = await Promise.all([
      Dissent.fetch(`https://api.sleeper.app/v1/league/${leagueId}`),
      Dissent.fetch(`https://api.sleeper.app/v1/league/${leagueId}/matchups/${_currentWeek||1}`),
      Dissent.fetch('https://api.sleeper.app/v1/players/nfl/trending/add'),
    ]);
    const league = JSON.parse(leagueRes.body);
    const matchups = JSON.parse(matchupRes.body);
    const trending = JSON.parse(trendRes.body);
    document.getElementById('fantasy-loading').style.display = 'none';
    if (!league) {
      content.innerHTML = `<div class="not-configured"><h3>League Not Found</h3><p>The Sleeper League ID <strong>${esc(String(leagueId))}</strong> wasn't found. Right-click the channel → <strong>Manage Plugin</strong> → Plugin Settings to update it.</p></div>`;
      return;
    }
    renderFantasy(league, matchups || [], trending);
  } catch(e) {
    document.getElementById('fantasy-loading').style.display = 'none';
    content.innerHTML = `<div class="state-msg">Failed to load fantasy data. Check the browser console for details.</div>`;
    console.error('[NFL Hub] loadFantasy error:', e);
  }
}

function renderFantasy(league, matchups, trending) {
  const content = document.getElementById('fantasy-content');
  const byMatchup = {};
  matchups.forEach(m => { (byMatchup[m.matchup_id] = byMatchup[m.matchup_id]||[]).push(m); });
  const savedTeam = _savedTeam;
  const myMatchup = savedTeam ? Object.values(byMatchup).find(pair=>pair.some(t=>t.roster_id?.toString()===savedTeam)) : null;
  let html = '';
  if (myMatchup && myMatchup.length===2) {
    const [t1,t2] = myMatchup; const p1=t1.points||0,p2=t2.points||0;
    html += `<div class="matchup-hero"><div class="matchup-hero-title">Your Matchup · Week ${_currentWeek}</div><div class="matchup-teams">
      <div class="matchup-team"><div class="matchup-team-name">Team ${t1.roster_id}</div><div class="matchup-pts ${p1>p2?'leading':p1<p2?'trailing':'tied'}">${p1.toFixed(1)}</div></div>
      <div class="matchup-vs">vs</div>
      <div class="matchup-team"><div class="matchup-team-name">Team ${t2.roster_id}</div><div class="matchup-pts ${p2>p1?'leading':p2<p1?'trailing':'tied'}">${p2.toFixed(1)}</div></div>
    </div></div>`;
  }
  html += `<div class="team-input-wrap"><input id="sleeperTeamInput" type="text" placeholder="Your roster ID (e.g. 3)" value="${esc(savedTeam)}" onchange="_savedTeam=this.value;_fantasyLoaded=false;loadFantasy()"><div class="hint">Enter your Sleeper roster ID to highlight your matchup</div></div>`;
  html += `<div class="section-head">All Matchups · Week ${_currentWeek}</div>`;
  Object.values(byMatchup).forEach(pair => {
    if (pair.length<2) return;
    const [t1,t2]=pair; const p1=t1.points||0,p2=t2.points||0;
    html += `<div style="display:flex;align-items:center;gap:6px;padding:7px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;margin-bottom:5px;font-size:10px"><span style="flex:1;font-weight:600">Roster ${t1.roster_id}</span><span style="font-weight:800;font-variant-numeric:tabular-nums">${p1.toFixed(1)}</span><span style="color:rgba(255,255,255,.3);font-size:8px">vs</span><span style="font-weight:800;font-variant-numeric:tabular-nums">${p2.toFixed(1)}</span><span style="flex:1;text-align:right;font-weight:600">Roster ${t2.roster_id}</span></div>`;
  });
  html += `<div class="section-head">Trending Adds</div>`;
  (trending||[]).slice(0,5).forEach(p => {
    html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;margin-bottom:4px;font-size:10px"><span style="flex:1;font-weight:600">${esc(p.player_id)}</span><span style="color:var(--win);font-size:9px">+${esc(String(p.count))} adds</span></div>`;
  });
  content.innerHTML = html;
}

// Pick'em tab
async function loadPickem() {
  document.getElementById('pickem-loading').style.display = 'block';
  try {
    const data = await fetchScoreboard(_viewWeek);
    const games = parseGames(data);
    document.getElementById('pickem-loading').style.display = 'none';
    renderPickem(games);
  } catch(e) {
    document.getElementById('pickem-loading').style.display = 'none';
    document.getElementById('pickem-content').innerHTML = `<div class="state-msg">Failed to load games.</div>`;
  }
}

function renderPickem(games) {
  const content = document.getElementById('pickem-content');
  const now = Date.now();
  const firstKickoff = games.reduce((min,g)=>Math.min(min,new Date(g.date).getTime()),Infinity);
  const locked = now >= firstKickoff;
  const savedPicks = _getPicks();
  let html = `<div class="pickem-header"><div class="pickem-title">Pick'em · Week ${_viewWeek}</div><div class="pickem-deadline">${locked?'🔒 Picks locked':'Locks at first kickoff'}</div></div>`;
  games.forEach(g => {
    const myPick = savedPicks[g.id]||null;
    const odds = _oddsCache[g.id];
    const awayCorrect = g.isFinal&&parseInt(g.away.score)>parseInt(g.home.score)?'correct':g.isFinal?'incorrect':'';
    const homeCorrect = g.isFinal&&parseInt(g.home.score)>parseInt(g.away.score)?'correct':g.isFinal?'incorrect':'';
    html += `<div class="pick-card">
      <button class="pick-btn${myPick===g.away.abbr?' selected':''}${locked?' locked':''}${g.isFinal&&myPick===g.away.abbr?' '+awayCorrect:''}" onclick="${locked?'':  `pickTeam('${esc(g.id)}','${esc(g.away.abbr)}',this)`}">
        <div class="pick-btn-logo"><img src="${teamLogoUrl(g.away.abbr)}" alt="${esc(g.away.abbr)}" onerror="this.parentNode.innerHTML='🏈'"></div>${esc(g.away.abbr)}
      </button>
      <div class="pick-meta"><div class="pick-time">${g.isLive?`Q${g.period}`:g.isFinal?'Final':fmtTime(g.date)}</div>${odds?`<div class="pick-spread">${esc(odds.spread)}</div>`:''}</div>
      <button class="pick-btn${myPick===g.home.abbr?' selected':''}${locked?' locked':''}${g.isFinal&&myPick===g.home.abbr?' '+homeCorrect:''}" onclick="${locked?'':`pickTeam('${esc(g.id)}','${esc(g.home.abbr)}',this)`}">
        <div class="pick-btn-logo"><img src="${teamLogoUrl(g.home.abbr)}" alt="${esc(g.home.abbr)}" onerror="this.parentNode.innerHTML='🏈'"></div>${esc(g.home.abbr)}
      </button>
    </div>`;
  });
  if (!locked) html += `<div class="submit-row"><button class="submit-btn" onclick="submitPicks(${JSON.stringify(games.map(g=>({id:g.id,away:g.away.abbr,home:g.home.abbr})))})">Submit Picks</button></div>`;
  html += `<div class="lb-section"><h4>Community Leaderboard</h4><div style="font-size:10px;color:rgba(255,255,255,.3);font-style:italic;text-align:center;padding:10px">Leaderboard updates after games go final.</div></div>`;
  content.innerHTML = html;
}

function pickTeam(gameId, abbr, btn) {
  const picks = _getPicks();
  picks[gameId] = abbr;
  _setPicks(picks);
  const card = btn.closest('.pick-card');
  card.querySelectorAll('.pick-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

async function submitPicks(games) {
  const picks = _getPicks();
  if (Object.keys(picks).length===0) { alert('Make at least one pick first.'); return; }
  const user = Dissent.getUser?.()?.username||'unknown';
  const abbrs = games.filter(g=>picks[g.id]).map(g=>picks[g.id]);
  const summary = `🏈 **${user}** locked in Week ${_viewWeek} picks: ${abbrs.slice(0,3).join(', ')}${abbrs.length>3?` +${abbrs.length-3} more`:''}`;
  const payload = JSON.stringify({version:1,type:'nfl-pickem',week:_viewWeek,season:_currentSeason,user,picks});
  try { await Dissent.botPost(`${summary}\n\`\`\`json\n${payload}\n\`\`\``); } catch(_) {}
  alert('Picks submitted!');
}

// Standings tab
async function loadStandings() {
  document.getElementById('standings-loading').style.display = 'block';
  try {
    const res = await Dissent.fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/standings');
    const data = JSON.parse(res.body);
    document.getElementById('standings-loading').style.display = 'none';
    renderStandings(data);
  } catch(e) {
    document.getElementById('standings-loading').style.display = 'none';
    document.getElementById('standings-content').innerHTML = `<div class="state-msg">Failed to load standings.</div>`;
  }
}

function renderStandings(data) {
  const el = document.getElementById('standings-content');
  let html = '';
  (data.children||[]).forEach(conf => {
    html += `<div class="conf-header">${esc(conf.name)}</div>`;
    (conf.children||[]).forEach(div => {
      html += `<div class="div-header">${esc(div.name)}</div>`;
      html += `<table class="nfl-standings-table"><thead><tr><th>Team</th><th>W</th><th>L</th><th>T</th><th>PCT</th><th>Streak</th></tr></thead><tbody>`;
      (div.standings?.entries||[]).forEach(entry => {
        const abbr = entry.team?.abbreviation||'';
        const stat = name => entry.stats?.find(s=>s.name===name)?.displayValue??'—';
        const seed = parseInt(stat('playoffSeed'))||99;
        const streak = stat('streak');
        const isElim = stat('clincher')==='e';
        const streakClass = streak.startsWith('W')?'streak-w':'streak-l';
        const seedHtml = seed<=7?`<span class="seed-badge">${seed}</span>`:'';
        html += `<tr class="${isElim?'elim':''}"><td>${seedHtml}${logoImg(abbr,'std-team-logo',`openModal('${esc(abbr)}')`)}${esc(abbr)}</td><td>${esc(stat('wins'))}</td><td>${esc(stat('losses'))}</td><td>${esc(stat('ties'))}</td><td>${esc(stat('winPercent'))}</td><td class="${streakClass}">${esc(streak)}</td></tr>`;
      });
      html += `</tbody></table>`;
    });
  });
  el.innerHTML = html;
}

// Init
Dissent.init({ onFallback: () => {} }).then(ctx => {
  _config = ctx.config || {};
  loadScores(null);
}).catch(console.error);
</script>
