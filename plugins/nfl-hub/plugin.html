<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <!-- Governs every relative path in this FILE (so they start with nfl-hub/).
       Paths inside a CSS file resolve relative to that CSS file instead. -->
  <base href="https://app.dissent.chat/plugins/">
  <title>NFL Hub</title>
  <!-- No ?v= cache-busters anywhere here. Caddy serves /plugins/** as
       "no-store, no-cache, must-revalidate", so a buster buys nothing — and on the
       module script it actively breaks: app.js?v=1 and app.js are two DIFFERENT module
       instances, so the views (which import ../core/app.js) would get a second, fresh
       copy with no replay and no context, double-booting the plugin. -->
  <link rel="stylesheet" href="nfl-hub/styles/base.css">
  <link rel="stylesheet" href="nfl-hub/styles/primetime.css">
  <link rel="stylesheet" href="nfl-hub/styles/stadium.css">
  <link rel="stylesheet" href="nfl-hub/styles/controlroom.css">
  <!-- The NATIVE league views. Last, so it can lean on the tokens and the panel
       styling the earlier sheets establish. -->
  <link rel="stylesheet" href="nfl-hub/styles/league.css">
  <!-- The League tab's cinematic layer. After league.css so it can raise the .db-*
       cells that sheet defines; before motion.css so reduced-motion still wins. -->
  <link rel="stylesheet" href="nfl-hub/styles/gridiron.css">
  <!-- The Leaders tab's broadcast layer. After controlroom.css, which owns the
       .ld-* layout this only lights. -->
  <link rel="stylesheet" href="nfl-hub/styles/podium.css">
  <!-- Game Center's. After stadium.css so it can sit under that hero, and after
       controlroom.css whose .drives/.mod it promotes. -->
  <link rel="stylesheet" href="nfl-hub/styles/booth.css">
  <!-- Movement last: it overrides durations for reduced motion, and that must
       win over anything an earlier sheet set. -->
  <link rel="stylesheet" href="nfl-hub/styles/motion.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand">
        <span class="title">NFL HUB</span>
        <span class="sub" id="season-label">Loading…</span>
      </div>
      <!-- Team and player pages are deliberately absent: they are drill-downs reached by
           clicking a chip, which is how every real sports app works. -->
      <nav id="nav" aria-label="Sections">
        <button data-act="nav" data-view="league" aria-current="true">Around the League</button>
        <button data-act="nav" data-view="game" aria-current="false">Game Center</button>
        <button data-act="nav" data-view="standings" aria-current="false">Standings</button>
        <button data-act="nav" data-view="leaders" aria-current="false">Leaders</button>
        <button data-act="nav" data-view="news" aria-current="false">News &amp; Odds</button>
        <button data-act="nav" data-view="fantasy" aria-current="false">Fantasy</button>
        <button data-act="nav" data-view="myleague" aria-current="false">My League</button>
      </nav>
    </header>
    <main id="main">
      <div class="state"><div class="spinner"></div><div>Loading NFL Hub…</div></div>
    </main>
  </div>
  <script type="module" src="nfl-hub/core/app.js"></script>
</body>
</html>
