<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <!-- Governs every relative path in this FILE (so they start with nfl-hub/).
       Paths inside a CSS file resolve relative to that CSS file instead. -->
  <base href="https://app.dissent.chat/plugins/">
  <title>NFL Hub</title>
  <link rel="stylesheet" href="nfl-hub/styles/base.css?v=1">
  <link rel="stylesheet" href="nfl-hub/styles/primetime.css?v=1">
  <link rel="stylesheet" href="nfl-hub/styles/stadium.css?v=1">
  <link rel="stylesheet" href="nfl-hub/styles/controlroom.css?v=1">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand">
        <span class="title">NFL HUB</span>
        <span class="sub" id="season-label">Loading…</span>
      </div>
      <nav id="nav" aria-label="Sections">
        <button data-act="nav" data-view="league" aria-current="true">Around the League</button>
        <button data-act="nav" data-view="game" aria-current="false">Game Center</button>
      </nav>
    </header>
    <main id="main">
      <div class="state"><div class="spinner"></div><div>Loading NFL Hub…</div></div>
    </main>
  </div>
  <script type="module" src="nfl-hub/core/app.js?v=1"></script>
</body>
</html>
