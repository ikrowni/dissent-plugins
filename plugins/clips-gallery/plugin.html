<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clips Gallery</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #0a0a12;
    color: rgba(255,255,255,0.85);
    min-height: 100vh;
    padding: 20px;
  }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: rgba(var(--glow, 108,99,255), 0.2);
    color: rgba(var(--bright, 168,139,250), 1);
  }
  h2 { font-size: 17px; font-weight: 700; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .clip {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .clip:hover { border-color: rgba(var(--glow, 108,99,255), 0.4); }
  .clip-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: rgba(var(--glow, 108,99,255), 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .clip-meta { padding: 8px 10px; }
  .clip-name { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip-by { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 2px; }
  .empty { text-align: center; padding: 48px 0; color: rgba(255,255,255,0.25); font-size: 13px; }
  .loading { text-align: center; padding: 48px 0; color: rgba(255,255,255,0.2); font-size: 12px; }
</style>
</head>
<body>
<div class="header">
  <span class="badge">Clips Gallery</span>
  <h2 id="title">Clips</h2>
</div>
<div id="content"><div class="loading">Requesting channel access…</div></div>
<script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
<script>
  function applyTheme(theme) {
    if (theme['--theme-glow-rgb']) document.documentElement.style.setProperty('--glow', theme['--theme-glow-rgb']);
    if (theme['--theme-bright-rgb']) document.documentElement.style.setProperty('--bright', theme['--theme-bright-rgb']);
  }

  async function loadClips() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading">Loading clips…</div>';

    let messages;
    try {
      messages = await Dissent.getMessages({ limit: 50 });
    } catch {
      messages = null;
    }
    if (!Array.isArray(messages)) {
      content.innerHTML = '<div class="empty">Could not load clips. You may need to grant channel:read permission.</div>';
      return;
    }

    // Filter to messages with attachments (image/video)
    const clips = messages.filter(msg => {
      try {
        const p = JSON.parse(msg.ciphertext || msg.content || '{}');
        return p.attachments && p.attachments.length > 0;
      } catch { return false; }
    });

    if (clips.length === 0) {
      content.innerHTML = '<div class="empty">No media attachments found in this channel.</div>';
      return;
    }

    const items = clips.flatMap(msg => {
      try {
        const p = JSON.parse(msg.ciphertext || msg.content || '{}');
        return (p.attachments || []).map(a => ({ url: a.url, name: a.filename, by: msg.username || 'unknown' }));
      } catch { return []; }
    });

    const isImage = url => /\.(jpg|jpeg|png|gif|webp|svg)(\?|$)/i.test(url);
    const isVideo = url => /\.(mp4|webm|mov)(\?|$)/i.test(url);

    content.innerHTML = `<div class="grid">${items.map(item => `
      <div class="clip">
        <div class="clip-thumb">
          ${isImage(item.url)
            ? `<img src="${Dissent.imageUrl(item.url)}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;">`
            : isVideo(item.url)
            ? `<video src="${Dissent.mediaUrl(item.url)}" muted style="width:100%;height:100%;object-fit:cover;"></video>`
            : '📎'}
        </div>
        <div class="clip-meta">
          <div class="clip-name">${item.name}</div>
          <div class="clip-by">by ${item.by}</div>
        </div>
      </div>
    `).join('')}</div>`;
  }

  async function main() {
    const ctx = await Dissent.init({ onFallback: () => console.warn('Running outside Dissent') });
    applyTheme(ctx.theme || {});
    const config = ctx.config || {};
    document.getElementById('title').textContent = config.title || 'Clips Gallery';
    loadClips();

    Dissent.on('theme-update', (theme) => applyTheme(theme || {}));
  }

  main().catch(err => console.error(err));
</script>
</body>
</html>
