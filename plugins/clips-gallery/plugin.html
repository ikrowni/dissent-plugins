<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clips Gallery</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#0a0a12;color:rgba(255,255,255,.85);padding:16px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .muted{color:rgba(255,255,255,.4);font-size:13px}
  .btn{background:rgba(108,99,255,.18);border:1px solid rgba(108,99,255,.3);color:#c3bcff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  .btn:hover{background:rgba(108,99,255,.28)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;animation:cardIn .32s ease both}
  .card:hover{border-color:rgba(108,99,255,.4)}
  .card.drag{opacity:.4}
  .card.over{border-color:rgba(108,99,255,.7);box-shadow:0 0 0 2px rgba(108,99,255,.35)}
  .card[draggable=true] .thumb{cursor:grab}
  .thumb{width:100%;aspect-ratio:16/9;background:rgba(108,99,255,.08);display:flex;align-items:center;justify-content:center;font-size:26px;object-fit:cover;cursor:pointer;border:0;color:inherit}
  .cap{padding:8px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contrib{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;margin-bottom:6px;width:100%;text-align:left;border:0;color:inherit;animation:cardIn .3s ease both}
  .contrib:hover{background:rgba(255,255,255,.06)}
  .avatar{width:34px;height:34px;border-radius:50%;background:rgba(108,99,255,.25);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;animation:fade .18s ease both}
  .lightbox.out{animation:fadeOut .16s ease both}
  .lightbox video{max-width:100%;max-height:80vh;border-radius:12px;animation:popIn .22s cubic-bezier(.2,.8,.3,1.2) both}
  .close{position:absolute;top:16px;right:20px;font-size:24px;cursor:pointer;color:#fff;background:0;border:0}
  .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;line-height:1;cursor:pointer;color:#fff;background:0;border:0;padding:8px 14px;opacity:.7}
  .nav:hover{opacity:1}
  .nav.prev{left:8px}.nav.next{right:8px}
  .count{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:13px}
  .edit{display:flex;gap:6px;padding:6px 10px;border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
  .edit button{background:0;border:0;color:rgba(255,255,255,.45);cursor:pointer;font-size:12px}
  .edit button:hover{color:#fff}
  .empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:48px 16px;color:rgba(255,255,255,.4)}
  .empty svg{width:60px;height:60px;opacity:.5}
  .empty.load svg{animation:pulse 1.4s ease-in-out infinite}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.7}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<div id="app"></div>
<script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null, STATE={};
const app = () => document.getElementById('app');

// Clapperboard/film glyph for empty + loading states.
const ART = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M2 7l3-4h4l-3 4M9 7l3-4h4l-3 4M16 7l3-4h2l-3 4"/><path d="M10 12l5 3-5 3z" fill="currentColor" stroke="none"/></svg>`;
const emptyState = (msg, loading) => `<div class="empty${loading?' load':''}">${ART}<p>${esc(msg)}</p></div>`;

/** Pure: given the visual order of clip ids after a drag, return the sort_order
 *  each id should persist to. Everything becomes explicitly pinned (>0) in order,
 *  matching the backend model (sort_order 0 = natural, >0 = pinned ascending). */
function reorderSortOrders(orderedIds){
  const out = {};
  orderedIds.forEach((id, i) => { out[id] = i + 1; });
  return out;
}
if (typeof module !== 'undefined') module.exports = { reorderSortOrders };

async function showContributors(){
  STATE={view:'contributors'};
  app().innerHTML = emptyState('Loading gallery…', true);
  let list=[];
  try { const r = await Dissent.gallery.contributors(); list=(r&&r.contributors)||[]; } catch(e){ console.error(e); }
  const share = `<div class="row" style="margin-bottom:14px"><button class="btn" id="shareBtn">Share a folder</button></div>`;
  if(!list.length){ app().innerHTML = share + emptyState('No clips shared here yet. Share one of your folders to start the gallery.'); wireShare(); return; }
  app().innerHTML = share + list.map((c,i) => `
    <button class="contrib" data-i="${i}" style="animation-delay:${Math.min(i,16)*28}ms">
      <span class="avatar">${c.avatar_url?`<img src="${esc(c.avatar_url)}" alt="" onerror="this.remove()">`:esc((c.display_name||'?').slice(0,2).toUpperCase())}</span>
      <span><span style="font-size:14px">${esc(c.display_name)}</span><br>
      <span class="muted">${esc(c.game_name||c.folder)} · ${c.clip_count} clips</span></span>
    </button>`).join('');
  app().querySelectorAll('.contrib').forEach(el => el.onclick = () => {
    const c = list[+el.dataset.i];
    showClips(c.user_id, c.folder, c.game_name);
  });
  wireShare();
}

async function showClips(userId, folder, game){
  STATE={view:'clips',userId,folder,game};
  const isOwner = ME && ME.id === userId;
  app().innerHTML = emptyState('Loading clips…', true);
  let clips=[];
  try { const r = await Dissent.gallery.list(userId, folder); clips=(r&&r.clips)||[]; } catch(e){ console.error(e); }

  app().innerHTML = `<div class="row"><button class="btn" id="back">← Back</button>
    <span style="font-size:14px">${esc(game||folder)}${isOwner?' <span class="muted">(your gallery — drag to reorder)</span>':''}</span></div>
    <div class="grid" id="grid"></div>`;
  document.getElementById('back').onclick = showContributors;

  const grid = document.getElementById('grid');
  function renderGrid(){
    grid.innerHTML = clips.map((c,i)=>card(c,i,isOwner)).join('') || emptyState('No clips.');
    grid.querySelectorAll('[data-idx]').forEach(el => el.onclick = () => openLightbox(clips, +el.dataset.idx));
    if(isOwner){ wireEdit(clips, renderGrid); wireDrag(clips, grid, renderGrid); }
  }
  renderGrid();
}

function card(c, i, isOwner){
  const poster = c.thumb_url
    ? `<img class="thumb" data-idx="${i}" src="${esc(c.thumb_url)}" alt="" loading="lazy">`
    : `<button class="thumb" data-idx="${i}">▶</button>`;
  const edit = isOwner ? `<div class="edit" data-i="${i}">
      <button data-act="caption">Caption</button>
      <button data-act="feature">${c.featured?'Unfeature':'Feature'}</button>
      <button data-act="hide">Hide</button>
      <button data-act="delete">Delete</button></div>` : '';
  return `<div class="card"${isOwner?' draggable="true"':''} data-card="${i}" style="animation-delay:${Math.min(i,20)*30}ms">${poster}<div class="cap">${esc(c.caption||'')}</div>${edit}</div>`;
}

function wireEdit(clips, rerender){
  app().querySelectorAll('.edit').forEach(box => box.querySelectorAll('button').forEach(b => b.onclick = async (ev) => {
    ev.stopPropagation();
    const c = clips[+box.dataset.i], id = c.attachment_id, act = b.dataset.act, folder = STATE.folder;
    try {
      if(act==='delete'){ if(!confirm('Delete this clip permanently?')) return; await Dissent.gallery.deleteClip(id); }
      else if(act==='caption'){ const cap = prompt('Caption', c.caption||''); if(cap==null) return; await Dissent.gallery.editClip(id, {caption:cap}, folder); }
      else if(act==='hide'){ await Dissent.gallery.editClip(id, {hidden:true}, folder); }
      else if(act==='feature'){ await Dissent.gallery.editClip(id, {sort_order: c.featured?0:1}, folder); }
      showClips(STATE.userId, folder, STATE.game);
    } catch(e){ console.error(e); }
  }));
}

// Owner drag-to-reorder. On drop, renumber the whole list to explicit sort_order
// (1..n) and persist each via editClip. Optimistically re-renders first.
function wireDrag(clips, grid, rerender){
  let from = null;
  grid.querySelectorAll('.card[draggable=true]').forEach(cardEl => {
    cardEl.addEventListener('dragstart', () => { from = +cardEl.dataset.card; cardEl.classList.add('drag'); });
    cardEl.addEventListener('dragend',   () => { from = null; grid.querySelectorAll('.card').forEach(c=>c.classList.remove('drag','over')); });
    cardEl.addEventListener('dragover',  e => { e.preventDefault(); cardEl.classList.add('over'); });
    cardEl.addEventListener('dragleave', () => cardEl.classList.remove('over'));
    cardEl.addEventListener('drop', async e => {
      e.preventDefault();
      const to = +cardEl.dataset.card;
      if(from==null || from===to) return;
      const [moved] = clips.splice(from, 1);
      clips.splice(to, 0, moved);
      rerender();
      const orders = reorderSortOrders(clips.map(c => c.attachment_id));
      try {
        await Promise.all(clips.map(c => Dissent.gallery.editClip(c.attachment_id, {sort_order: orders[c.attachment_id]}, STATE.folder)));
        clips.forEach(c => { c.featured = true; });
      } catch(err){ console.error(err); }
    });
  });
}

function wireShare(){
  const btn = document.getElementById('shareBtn'); if(!btn) return;
  btn.onclick = async () => {
    let folders=[];
    try { const r = await Dissent.gallery.myFolders(); folders=(r&&r.folders)||[]; } catch(e){ console.error(e); }
    if(!folders.length){ alert('You have no clip folders yet. Record and save some clips first.'); return; }
    const pick = prompt('Share which folder?\n' + folders.join('\n'), folders[0]);
    if(pick && folders.includes(pick)){ try { await Dissent.gallery.share(pick, pick); showContributors(); } catch(e){ console.error(e); } }
  };
}

// Lightbox with ←/→/Esc navigation and neighbour prefetch.
function openLightbox(clips, index){
  let i = index;
  const box = document.createElement('div'); box.className='lightbox';
  const url = c => c && c.video_url;
  function draw(){
    const c = clips[i];
    box.innerHTML =
      `<button class="close" aria-label="Close">✕</button>` +
      (clips.length>1 ? `<button class="nav prev" aria-label="Previous">‹</button><button class="nav next" aria-label="Next">›</button>` : '') +
      `<video src="${esc(url(c))}" controls autoplay></video>` +
      (clips.length>1 ? `<div class="count">${i+1} / ${clips.length}</div>` : '');
    box.querySelector('.close').onclick = close;
    const prev = box.querySelector('.prev'), next = box.querySelector('.next');
    if(prev) prev.onclick = e => { e.stopPropagation(); go(-1); };
    if(next) next.onclick = e => { e.stopPropagation(); go(1); };
    prefetch();
  }
  function go(d){ i = (i + d + clips.length) % clips.length; draw(); }
  // Warm neighbours with a hidden preload video (same media-src → CSP-safe).
  function prefetch(){
    box.querySelectorAll('video.pf').forEach(v=>v.remove());
    [i-1, i+1].forEach(n => {
      const c = clips[(n + clips.length) % clips.length];
      if(!c || c===clips[i]) return;
      const v = document.createElement('video');
      v.className='pf'; v.preload='auto'; v.src=url(c); v.muted=true;
      v.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
      box.appendChild(v);
    });
  }
  function key(e){
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft' && clips.length>1) go(-1);
    else if(e.key==='ArrowRight' && clips.length>1) go(1);
  }
  function close(){
    document.removeEventListener('keydown', key);
    box.classList.add('out');
    setTimeout(()=>box.remove(), 150);
  }
  box.onclick = e => { if(e.target===box) close(); };
  document.addEventListener('keydown', key);
  document.body.appendChild(box);
  draw();
}

async function main(){
  const ctx = await Dissent.init({ onFallback: () => {} });
  ME = ctx.user || null;
  await showContributors();
}
main().catch(e => { app().innerHTML = emptyState('Gallery failed to load.'); console.error(e); });
</script>
</body></html>
