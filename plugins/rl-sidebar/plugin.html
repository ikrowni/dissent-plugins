<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rocket League Profile</title>
  <link rel="stylesheet" href="rl-sidebar-styles.css?v=4">
</head>
<body>
  <div id="root">
    <div class="sidebar-loading">
      <div class="spinner"></div>
      <span>Loading…</span>
    </div>
  </div>

  <script>
  window.addEventListener('error', e => {
    document.getElementById('root').innerHTML =
      '<pre style="color:#f87171;padding:12px;white-space:pre-wrap;font-size:11px">ERROR: ' + (e.message||'') + '</pre>';
  });
  window.addEventListener('unhandledrejection', e => {
    document.getElementById('root').innerHTML =
      '<pre style="color:#f87171;padding:12px;white-space:pre-wrap;font-size:11px">UNHANDLED: ' + (e.reason?.message||String(e.reason)) + '</pre>';
  });
  </script>
  <script type="module" src="rl-sidebar-main.js?v=4"></script>
</body>
</html>
