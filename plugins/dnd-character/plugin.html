<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>D&D Character</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dnd-gold:#d4af37;--bg:#07070d;--surface:rgba(255,255,255,.06);--border:rgba(212,175,55,.2);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.5)}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
.card{padding:14px;display:flex;flex-direction:column;gap:10px}
.char-header{display:flex;align-items:center;gap:10px}
.char-portrait{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--dnd-gold),#c0392b);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:2px solid var(--dnd-gold)}
.char-name{font-size:16px;font-weight:800}
.char-subtitle{font-size:10px;color:var(--muted);margin-top:1px}
.char-alignment{font-size:10px;color:var(--dnd-gold);font-style:italic}
.hp-bar-wrap{background:rgba(0,0,0,.4);border-radius:4px;height:5px;overflow:hidden}
.hp-bar{height:100%;border-radius:4px;background:#22c55e;transition:width .3s}
.ability-row{display:flex;gap:4px}
.ability-pill{flex:1;text-align:center;padding:5px 2px;background:var(--surface);
  border:1px solid var(--border);border-radius:6px}
.ability-pill-val{font-size:13px;font-weight:800;color:var(--dnd-gold)}
.ability-pill-name{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.backstory{font-size:10px;color:var(--muted);line-height:1.5;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;
  max-height:50px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,black 70%,transparent 100%)}
.tag-row{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 7px;border-radius:20px;background:var(--surface);
  border:1px solid var(--border);color:var(--muted)}
.restricted-msg{font-size:11px;color:var(--muted);text-align:center;padding:12px;font-style:italic}
.empty-msg{font-size:12px;color:var(--muted);text-align:center;padding:16px}
</style>
</head>
<body>
<div id="root"></div>

<script>
let _reqId=0,_pending={};
function request(action,params){
  return new Promise((resolve,reject)=>{
    const id=++_reqId;_pending[id]={resolve,reject};
    parent.postMessage({type:'dissent:request',id,action,params},'*');
    setTimeout(()=>{if(_pending[id]){delete _pending[id];reject(new Error('timeout'));}},8000);
  });
}
window.addEventListener('message',e=>{
  if(e.data?.type==='dissent:init'){onInit(e.data);return;}
  if(e.data?.type==='dissent:response'){
    const p=_pending[e.data.id];
    if(p){delete _pending[e.data.id];e.data.ok?p.resolve(e.data.data):p.reject(new Error(e.data.error));}
  }
});
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtMod(m){return m>=0?`+${m}`:`${m}`;}
function abilityMod(s){return Math.floor((s-10)/2);}
const ABILITIES=['str','dex','con','int','wis','cha'];

async function onInit(data) {
  const root = document.getElementById('root');
  const ctx = data.context || {};
  const channelData = ctx.channelData;

  if (!channelData || channelData.pluginId !== 'dnd-hub') {
    root.innerHTML = '';
    return;
  }

  const char = channelData.data?.character;
  const isRestricted = channelData.data?.restricted;

  if (!char) {
    root.innerHTML = `<div class="empty-msg">No D&D character in this campaign.</div>`;
    return;
  }

  const pct = char.hpMax > 0 ? Math.max(0, Math.min(100, (char.hp / char.hpMax) * 100)) : 0;
  const hpColor = pct > 50 ? '#22c55e' : pct > 25 ? '#f59e0b' : '#ef4444';

  root.innerHTML = `
    <div class="card">
      <div class="char-header">
        <div class="char-portrait">${classEmoji(char.class)}</div>
        <div>
          <div class="char-name">${esc(char.name)}</div>
          <div class="char-subtitle">${esc(char.race||'')} ${esc(char.class||'')} · Level ${char.level||1}</div>
          <div class="char-alignment">${esc(char.alignment||'')}</div>
        </div>
      </div>

      ${!isRestricted ? `
        <div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:3px">
            <span>HP</span><span>${char.hp}/${char.hpMax}</span>
          </div>
          <div class="hp-bar-wrap">
            <div class="hp-bar" style="width:${pct}%;background:${hpColor}"></div>
          </div>
        </div>

        <div style="display:flex;gap:10px">
          ${[{l:'AC',v:char.ac},{l:'Init',v:fmtMod(abilityMod(char.dex??10))},{l:'Speed',v:(char.speed||30)+'ft'}].map(s=>`
            <div style="flex:1;text-align:center;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px">
              <div style="font-size:14px;font-weight:800;color:var(--dnd-gold)">${s.v}</div>
              <div style="font-size:8px;color:var(--muted);text-transform:uppercase">${s.l}</div>
            </div>
          `).join('')}
        </div>

        <div class="ability-row">
          ${ABILITIES.map(a=>`
            <div class="ability-pill">
              <div class="ability-pill-val">${char[a]??10}</div>
              <div class="ability-pill-name">${a.toUpperCase()}</div>
            </div>
          `).join('')}
        </div>

        ${char.conditions?.length ? `
          <div class="tag-row">
            ${char.conditions.map(c=>`<span class="tag" style="border-color:rgba(239,68,68,.3);color:#fca5a5">${esc(c)}</span>`).join('')}
          </div>
        ` : ''}
      ` : `<div class="restricted-msg">Join this campaign to see full character details.</div>`}

      ${char.backstory ? `<div class="backstory">${esc(char.backstory)}</div>` : ''}

      <div class="tag-row">
        ${char.background ? `<span class="tag">${esc(char.background)}</span>` : ''}
        ${char.deity ? `<span class="tag">⚡ ${esc(char.deity)}</span>` : ''}
      </div>
    </div>
  `;
}

function classEmoji(cls) {
  const e={barbarian:'🪓',bard:'🎵',cleric:'✝️',druid:'🌿',fighter:'⚔️',monk:'👊',
    paladin:'🛡️',ranger:'🏹',rogue:'🗡️',sorcerer:'✨',warlock:'🌑',wizard:'📚'};
  return e[cls?.toLowerCase()]||'⚔️';
}
</script>
</body>
</html>
