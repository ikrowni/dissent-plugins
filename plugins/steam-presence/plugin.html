<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Steam Presence</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07070d;
      color: white;
      padding: 14px 16px;
      min-height: 80px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .steam-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #1b2838, #2a475e);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-text { flex: 1; }
    .platform-name {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: rgba(255,255,255,0.35);
    }
    .playing-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #23a55a;
      box-shadow: 0 0 6px #23a55a;
      flex-shrink: 0;
    }
    .game-name { font-size: 12px; color: rgba(168,139,250,0.95); font-weight: 600; }
    .game-label { font-size: 11px; color: rgba(255,255,255,0.4); }
    .offline-row { font-size: 11px; color: rgba(255,255,255,0.3); font-style: italic; margin-top: 4px; }
    .loading { opacity: 0.4; font-size: 11px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

<div id="root"><div class="loading">Loading…</div></div>

<script>
  let profileOwnerId = null;
  let coreUrl = '';

  window.addEventListener('message', e => {
    if (e.data?.type === 'dissent:init') {
      profileOwnerId = e.data.context?.profileOwnerId ?? null;
      coreUrl = e.data.context?.coreUrl ?? '';
      onInit();
    }
  });

  const root = document.getElementById('root');

  async function onInit() {
    if (!profileOwnerId) {
      root.innerHTML = '<div class="loading">No profile context.</div>';
      return;
    }
    await loadPresence();
    setInterval(loadPresence, 60_000);
  }

  async function loadPresence() {
    if (!profileOwnerId || !coreUrl) return;
    try {
      const res = await fetch(`${coreUrl}/api/v1/presence/steam/${profileOwnerId}`);
      const data = await res.json();
      render(data);
    } catch {
      render(null);
    }
  }

  function render(presence) {
    root.innerHTML = `
      <div class="header">
        <div class="steam-logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
            <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.522 4.524-4.522 2.494 0 4.524 2.027 4.524 4.522s-2.03 4.522-4.524 4.522h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.497 1.009 2.455-.397.957-1.494 1.409-2.455 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z"/>
          </svg>
        </div>
        <div class="header-text">
          <div class="platform-name">Steam</div>
        </div>
      </div>
      ${presence
        ? `<div class="playing-row">
             <div class="dot"></div>
             <div>
               <div class="game-label">Currently Playing</div>
               <div class="game-name">${esc(presence.game_name)}</div>
             </div>
           </div>`
        : `<div class="offline-row">Not currently playing</div>`
      }
    `;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
