<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Capability Probe</title>
  <style>
    body { font: 12px/1.4 ui-monospace, monospace; background: #111; color: #ddd; margin: 0; padding: 10px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    .ok { color: #4ade80; } .no { color: #f87171; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 1px 6px 1px 0; vertical-align: top; word-break: break-word; }
    button { font: inherit; margin: 6px 6px 6px 0; }
    #probe-json { display: none; }
  </style>
</head>
<body>
  <h1 id="probe-summary">Capability Probe — running…</h1>
  <div id="probe-ctx"></div>
  <button id="ui-checks" type="button">Run checks that open a window</button>
  <table id="probe-rows"></table>
  <pre id="probe-json"></pre>
  <script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
  <script>
  // Capability Probe 2.0.1 (plugin program session 2, 2026-11-10) — 2.0.1 drops `voice`, to test a narrowing update.
  // Calls each host action once and records what came back — no verdicts here. The
  // script driving it (projects: docs/research/2026-11-1x-plugin-everywhere-audit.md)
  // decides what each answer should be for the place and the person.
  (async () => {
    const rowsEl = document.getElementById('probe-rows');
    const results = {};
    let seq = 0;
    function raw(action, params, timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        const id = `cp-${++seq}-${Date.now()}`;
        const h = (ev) => {
          const m = ev.data;
          if (m && m.type === 'dissent:response' && m.id === id) {
            window.removeEventListener('message', h);
            if (m.ok) resolve(m.data); else reject(new Error(m.error || 'failed'));
          }
        };
        window.addEventListener('message', h);
        window.parent.postMessage({ type: 'dissent:request', id, action, params: params || {} }, '*');
        setTimeout(() => { window.removeEventListener('message', h); reject(new Error('timeout')); }, timeoutMs);
      });
    }
    const brief = (v) => { try { const s = JSON.stringify(v); return s === undefined ? '' : s.slice(0, 160); } catch { return String(v); } };
    function record(name, ok, detail) {
      results[name] = { ok, detail };
      const tr = document.createElement('tr');
      tr.setAttribute('data-probe', name);
      tr.setAttribute('data-ok', String(ok));
      tr.innerHTML = '<td class="' + (ok ? 'ok' : 'no') + '">' + (ok ? 'ok' : 'refused') + '</td><td></td><td></td>';
      tr.children[1].textContent = name;
      tr.children[2].textContent = detail;
      rowsEl.appendChild(tr);
      document.getElementById('probe-json').textContent = JSON.stringify(results);
    }
    async function call(name, action, params, timeoutMs) {
      try { const d = await raw(action, params, timeoutMs); record(name, true, brief(d)); return d; }
      catch (e) { record(name, false, (e && e.message) || String(e)); return undefined; }
    }

    let ctx = null;
    try { ctx = await Dissent.init(); } catch (e) { record('init', false, e.message); }
    const ctxType = ctx && (ctx.contextType || ctx.context || (ctx.channel ? 'channel' : '?'));
    document.getElementById('probe-ctx').textContent =
      'context=' + ctxType + ' server=' + (ctx && ctx.server && ctx.server.id) +
      ' channel=' + (ctx && ctx.channel && ctx.channel.id) + ' granted=' + ((ctx && ctx.permissions) || []).join(',');
    record('init', !!ctx, ctx ? brief({ contextType: ctxType, perms: ctx.permissions, user: !!ctx.user }) : '');

    const me = await call('profile:read', 'profile:read');
    await call('identity:get', 'identity:get');
    await call('members:list', 'members:list');
    await call('presence:read', 'presence:read');

    await call('storage:set user', 'storage:set', { scope: 'user', key: 'probe-u', value: { n: 1 } });
    await call('storage:get user', 'storage:get', { scope: 'user', key: 'probe-u' });
    await call('storage:set server', 'storage:set', { scope: 'server', key: 'probe-s', value: { n: 2 } });
    await call('storage:get server', 'storage:get', { scope: 'server', key: 'probe-s' });
    await call('storage:list server', 'storage:list', { scope: 'server', prefix: 'probe-' });
    await call('storage:localSet', 'storage:localSet', { key: 'probe-l', value: 'x' });
    await call('storage:localGet', 'storage:localGet', { key: 'probe-l' });
    await call('log:append', 'log:append', { data: { probe: Date.now() } });
    await call('log:read', 'log:read', { limit: 3 });

    await call('realtime:publish', 'realtime:publish', { event: 'probe', data: { t: Date.now() } });
    await call('fetch:external allowed', 'fetch:external', { url: 'https://example.com/' }, 15000);
    await call('fetch:external other host', 'fetch:external', { url: 'https://example.org/' }, 15000);
    if (ctxType === 'channel') await call('bot:post', 'bot:post', { content: 'capability-probe: bot:post works' });
    await call('embed:render', 'embed:render', { payload: { html: '<b>capability-probe embed</b>', height: 40 } });
    const myId = me && (me.id || me.user_id);
    await call('voice.setGain', 'voice.setGain', { userId: myId || 'nobody', gain: 1 });
    await call('sparks.balance', 'sparks.balance');
    await call('sparks.rules', 'sparks.rules');

    // Permission-free actions that gate themselves.
    await call('module:invoke', 'module:invoke', { payload: { op: 'ping' } });
    const png = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='), (c) => c.charCodeAt(0)).buffer;
    const up = await call('files:upload', 'files:upload', { data: png, name: 'probe.png', mime: 'image/png' }, 15000);
    await call('files:list', 'files:list', {});
    if (up && up.id) {
      await call('files:getUrl', 'files:getUrl', { fileId: up.id });
      await call('files:delete', 'files:delete', { fileId: up.id });
    }
    await call('games.lobbies', 'games.lobbies', {});
    await call('command:register', 'command:register', { command: '/probe' });
    await call('events:subscribe', 'events:subscribe', { events: ['probe'] });

    // Not declared by this plugin — must be refused everywhere.
    await call('wallet.connect (undeclared)', 'wallet.connect', {});
    await call('sparks.charge (undeclared)', 'sparks.charge', { amount: 1, reason: 'probe' });
    await call('tournaments (undeclared)', 'tournaments.report', {});
    // Desktop-only or personal-only — refused on the web and in a server install.
    await call('game.telemetry.status', 'game.telemetry.status', {});
    await call('game.saves.runs', 'game.saves.runs', {});
    await call('overlay.context', 'overlay.context', {});
    await call('net.fetch', 'net.fetch', { url: 'https://example.com/' });
    await call('friends.list', 'friends.list', {});
    await call('ai.choose', 'ai.choose', {});
    await call('unknown action', 'probe.nothing', {});

    // Clean up what this run stored.
    await call('storage:delete user', 'storage:delete', { scope: 'user', key: 'probe-u' });
    await call('storage:delete server', 'storage:delete', { scope: 'server', key: 'probe-s' });

    const n = Object.values(results).filter((r) => r.ok).length;
    document.getElementById('probe-summary').textContent = 'Capability Probe — done: ' + n + ' ok, ' + (Object.keys(results).length - n) + ' refused';
    document.body.setAttribute('data-probe-done', '1');

    // These open a window in the app, so only on a click.
    document.getElementById('ui-checks').addEventListener('click', async () => {
      await call('links:open', 'links:open', { url: 'https://example.com/' });
      await call('media.embed', 'media.embed', { url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', title: 'probe' });
      await call('consent.ask', 'consent.ask', {}, 20000);
      document.body.setAttribute('data-ui-done', '1');
    });
  })();
  </script>
</body>
</html>
