<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<base href="https://app.dissent.chat/plugins/">
<title>Sleeper Fantasy</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sl-green: #00c853; --sl-gold: #FFB612; --sl-red: #ef4444;
  --bg: #0a0a14; --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.07);
  --text: rgba(255,255,255,0.9); --text-dim: rgba(255,255,255,0.5); --text-muted: rgba(255,255,255,0.25);
}
body { font-family: system-ui,-apple-system,'Segoe UI',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 12px; overflow-x: hidden; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Header ── */
.s-header { background: linear-gradient(135deg, rgba(0,200,83,.2) 0%, rgba(10,10,20,1) 80%); padding: 10px 12px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); }
.s-header-row { display: flex; align-items: center; justify-content: space-between; }
.s-title { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.s-account { font-size: 8px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.s-switch { color: rgba(0,200,83,.6); cursor: pointer; text-decoration: underline; background: none; border: none; font-size: 8px; padding: 0; }
.s-refresh { background: none; border: none; font-size: 9px; color: var(--text-muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.s-refresh:hover { background: var(--surface); }

/* ── League tabs ── */
.league-tabs { display: flex; gap: 4px; padding: 8px 10px 0; overflow-x: auto; scrollbar-width: none; }
.league-tabs::-webkit-scrollbar { display: none; }
.league-tab { font-size: 9px; font-weight: 700; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.league-tab.tab-active { background: rgba(0,200,83,.15); border-color: rgba(0,200,83,.4); color: var(--sl-green); }

/* ── Sections ── */
.s-sect { font-size: 7px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.22); padding: 10px 12px 5px; display: flex; align-items: center; gap: 6px; }
.s-sect::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.07); }
.s-empty { padding: 12px; text-align: center; font-size: 9px; color: var(--text-muted); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--sl-green); border-radius: 50%; animation: spin .7s linear infinite; margin: 24px auto; }

/* ── Setup screen ── */
.setup-screen { display: flex; flex-direction: column; align-items: center; padding: 32px 20px 24px; gap: 10px; }
.setup-icon { font-size: 32px; }
.setup-title { font-size: 14px; font-weight: 900; letter-spacing: .04em; }
.setup-desc { font-size: 10px; color: var(--text-dim); text-align: center; line-height: 1.5; }
.setup-form { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.setup-input { width: 100%; background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 11px; color: var(--text); outline: none; }
.setup-input:focus { border-color: rgba(0,200,83,.5); }
.setup-btn { background: rgba(0,200,83,.2); border: 1px solid rgba(0,200,83,.4); color: var(--sl-green); font-size: 11px; font-weight: 700; padding: 8px; border-radius: 8px; cursor: pointer; }
.setup-btn:hover { background: rgba(0,200,83,.3); }
.setup-btn:disabled { opacity: .5; cursor: default; }
.setup-error { font-size: 9px; color: var(--sl-red); text-align: center; }

/* ── Matchup ── */
.matchup-card { margin: 4px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.matchup-score { display: flex; align-items: center; gap: 8px; }
.matchup-side { flex: 1; text-align: center; }
.matchup-side.side-lead .side-pts { color: var(--text); }
.matchup-side:not(.side-lead) .side-pts { color: var(--text-muted); }
.side-name { font-size: 9px; font-weight: 700; color: var(--text-dim); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-pts { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.matchup-vs { font-size: 9px; color: var(--text-muted); font-weight: 700; }
.starters-label { font-size: 7px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin: 8px 0 4px; }
.starters-list { display: flex; flex-direction: column; gap: 2px; }
.starter-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.04); }
.starter-pos { font-size: 7px; font-weight: 800; color: var(--sl-green); width: 24px; flex-shrink: 0; }
.starter-name { flex: 1; font-size: 9px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.starter-pts { font-size: 9px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-dim); }

/* ── Standings ── */
.standings-list { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.standing-row { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; }
.standing-row.playoff-spot { border-color: rgba(0,200,83,.2); }
.standing-rank { font-size: 8px; font-weight: 800; color: var(--text-muted); width: 14px; }
.standing-row.playoff-spot .standing-rank { color: var(--sl-green); }
.standing-name { flex: 1; font-size: 9px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.standing-record { font-size: 9px; font-weight: 700; color: var(--text-dim); font-variant-numeric: tabular-nums; width: 32px; text-align: right; }
.standing-pts { font-size: 8px; color: var(--text-muted); font-variant-numeric: tabular-nums; width: 44px; text-align: right; }

/* ── Transactions ── */
.tx-list { display: flex; flex-direction: column; gap: 3px; padding: 0 8px; }
.tx-row { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; }
.tx-tag { font-size: 7px; font-weight: 800; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0; }
.tag-trade { background: rgba(34,197,94,.15); color: #22c55e; }
.tag-waiver { background: rgba(139,92,246,.15); color: #a78bfa; }
.tag-fa { background: rgba(255,255,255,.1); color: var(--text-dim); }
.tx-detail { flex: 1; font-size: 8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-time { font-size: 7px; color: var(--text-muted); flex-shrink: 0; }

/* ── Bracket ── */
.bracket-list { padding: 0 8px; }
.bracket-champ { font-size: 12px; font-weight: 900; text-align: center; padding: 8px; color: var(--sl-gold); }
.bracket-round { font-size: 7px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); margin: 8px 0 4px; }
.bracket-match { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; font-size: 9px; margin-bottom: 3px; }
.bracket-winner { font-weight: 700; }
.bracket-def { color: var(--text-muted); }
.bracket-loser { color: var(--text-muted); }

/* ── Draft ── */
.draft-card { padding: 0 8px; }
.draft-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.draft-type { font-size: 10px; font-weight: 800; }
.draft-status { font-size: 8px; color: var(--text-muted); }
.draft-date { font-size: 9px; color: var(--text-dim); margin-bottom: 8px; }
.draft-picks-label { font-size: 7px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin: 8px 0 4px; }
.draft-pick-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.04); }
.pick-num { font-size: 8px; font-weight: 800; color: var(--sl-gold); width: 20px; flex-shrink: 0; }
.pick-pos { font-size: 7px; font-weight: 800; color: var(--sl-green); width: 22px; flex-shrink: 0; }
.pick-name { flex: 1; font-size: 9px; font-weight: 600; }
.pick-team { font-size: 8px; color: var(--text-muted); }

.s-footer { padding: 10px 12px 16px; text-align: center; border-top: 1px solid var(--border); font-size: 8px; color: rgba(255,255,255,.2); margin-top: 10px; }
.s-footer a { color: rgba(0,200,83,.4); text-decoration: none; }
</style>
</head>
<body>

<div id="app"><div class="spinner"></div></div>

<script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
<script type="module">
import * as API from './sleeper-sidebar/sleeper-sidebar-api.js';
import { esc, renderSpinner, renderError, renderSectionHeader, renderSetupScreen, renderLeagueTabs,
         renderMatchup, renderStandings, renderTransactions, renderBracket, renderDraftInfo }
  from './sleeper-sidebar/sleeper-sidebar-render.js';

// ── Inline request bridge for storage (IIFE SDK does not expose storage) ──
const _pending = {};
let _msgId = 0;
function request(action, params = {}) {
  return new Promise((resolve, reject) => {
    const id = ++_msgId;
    _pending[id] = { resolve, reject };
    parent.postMessage({ type: 'dissent:request', id, action, params }, '*');
    setTimeout(() => { if (_pending[id]) { delete _pending[id]; reject(new Error('timeout')); } }, 10000);
  });
}
window.addEventListener('message', e => {
  if (e.data?.type !== 'dissent:response') return;
  const p = _pending[e.data.id];
  if (p) { delete _pending[e.data.id]; e.data.ok ? p.resolve(e.data.data) : p.reject(new Error(e.data.error)); }
});

// ── State ──
let _identity = null;
let _nflState = null;
let _leagues = [];
let _selectedIdx = 0;
let _leagueCache = {};

// ── Storage helpers ──
async function storageGet(key) {
  try { const r = await request('storage:get', { key, scope: 'user' }); return r?.value ?? null; } catch { return null; }
}
async function storageSet(key, value) {
  try { await request('storage:set', { key, value, scope: 'user' }); } catch {}
}

// ── Render root ──
function setApp(html) {
  document.getElementById('app').innerHTML = html;
}

// ── Setup screen ──
function showSetupScreen() {
  setApp(`
    <div class="s-header">
      <div class="s-header-row"><div class="s-title">🏈 Sleeper Fantasy</div></div>
    </div>
    ${renderSetupScreen()}
    <div class="s-footer"><a href="https://sleeper.com" target="_blank">sleeper.com</a></div>
  `);

  const input = document.getElementById('usernameInput');
  const btn = document.getElementById('connectBtn');
  const errEl = document.getElementById('setupError');

  async function tryConnect() {
    const username = input.value.trim();
    if (!username) return;
    btn.disabled = true;
    btn.textContent = 'Connecting…';
    errEl.style.display = 'none';
    try {
      const user = await API.fetchUser(username);
      if (!user?.user_id) throw new Error('User not found');
      _identity = { username: user.username, user_id: user.user_id, display_name: user.display_name || user.username };
      await storageSet('sleeper:identity', _identity);
      await loadMain();
    } catch (e) {
      errEl.textContent = 'Username not found. Check your Sleeper username and try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Connect';
    }
  }

  btn.addEventListener('click', tryConnect);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryConnect(); });
  input.focus();
}

// ── Main view ──
async function loadMain() {
  _nflState = null;
  _leagues = [];
  setApp(renderSpinner());
  try {
    _nflState = await API.fetchNflState();
    _leagues = await API.fetchLeagues(_identity.user_id, _nflState.season);
    if (!_leagues?.length) {
      setApp(`
        <div class="s-header">
          <div class="s-header-row"><div class="s-title">🏈 Sleeper Fantasy</div></div>
          <div class="s-account">${esc(_identity.display_name)} <button class="s-switch" id="switchBtn">switch</button></div>
        </div>
        <div class="s-empty" style="padding:24px;text-align:center;">No leagues found for the ${esc(_nflState.season)} season.</div>
      `);
      document.getElementById('switchBtn')?.addEventListener('click', async () => {
        await storageSet('sleeper:identity', null);
        _identity = null;
        showSetupScreen();
      });
      return;
    }
    const savedIdx = parseInt(await storageGet('sleeper:selected_league'), 10);
    _selectedIdx = Math.min(isNaN(savedIdx) ? 0 : savedIdx, Math.max(0, _leagues.length - 1));
  } catch(e) {
    setApp(renderError('Failed to load leagues. Check your connection and try again.'));
    return;
  }
  renderShell();
  await loadLeague(_leagues[_selectedIdx]);
}

function renderShell() {
  const tabsHtml = renderLeagueTabs(_leagues, _selectedIdx);
  setApp(`
    <div class="s-header">
      <div class="s-header-row">
        <div class="s-title">🏈 Sleeper Fantasy</div>
        <button class="s-refresh" id="refreshBtn" title="Refresh">↻</button>
      </div>
      <div class="s-account">
        ${esc(_identity.display_name)}
        <button class="s-switch" id="switchBtn">switch</button>
      </div>
    </div>
    ${tabsHtml}
    <div id="leagueContent">${renderSpinner()}</div>
    <div class="s-footer"><a href="https://sleeper.com" target="_blank">sleeper.com</a></div>
  `);

  document.getElementById('switchBtn')?.addEventListener('click', async () => {
    await storageSet('sleeper:identity', null);
    _identity = null;
    _leagueCache = {};
    showSetupScreen();
  });
  document.getElementById('refreshBtn')?.addEventListener('click', async () => {
    const league = _leagues[_selectedIdx];
    if (league) { delete _leagueCache[league.league_id]; await loadLeague(league); }
  });
  document.querySelectorAll('.league-tab').forEach(tab => {
    tab.addEventListener('click', async () => {
      _selectedIdx = parseInt(tab.dataset.idx, 10);
      await storageSet('sleeper:selected_league', _selectedIdx);
      document.querySelectorAll('.league-tab').forEach((t, i) => t.classList.toggle('tab-active', i === _selectedIdx));
      await loadLeague(_leagues[_selectedIdx]);
    });
  });
}

async function loadLeague(league) {
  if (!league) return;
  const el = document.getElementById('leagueContent');
  if (!el) return;
  el.innerHTML = renderSpinner();

  try {
    if (!_leagueCache[league.league_id]) {
      const week = _nflState.display_week || _nflState.week || 1;
      const isOff = _nflState.season_type === 'off';

      if (isOff) {
        const [rosters, users, bracket, drafts] = await Promise.all([
          API.fetchRosters(league.league_id),
          API.fetchLeagueUsers(league.league_id),
          API.fetchWinnersBracket(league.league_id),
          API.fetchDrafts(league.league_id),
        ]);
        let picks = [];
        if (drafts?.[0]?.draft_id && drafts[0].status === 'complete') {
          picks = await API.fetchDraftPicks(drafts[0].draft_id).catch(() => []);
        }
        _leagueCache[league.league_id] = { rosters, users, bracket, drafts, picks, isOff: true };
      } else {
        const [rosters, users, matchups, transactions] = await Promise.all([
          API.fetchRosters(league.league_id),
          API.fetchLeagueUsers(league.league_id),
          API.fetchMatchups(league.league_id, week),
          API.fetchTransactions(league.league_id, week).catch(() => []),
        ]);
        let players = null;
        try { players = await API.fetchPlayers(); } catch {}
        _leagueCache[league.league_id] = { rosters, users, matchups, transactions, players, isOff: false };
      }
    }

    const data = _leagueCache[league.league_id];
    el.innerHTML = data.isOff ? renderOffSeason(data, league) : renderInSeason(data, league);
  } catch(e) {
    el.innerHTML = renderError('Failed to load league data. Tap refresh to try again.');
  }
}

function renderInSeason(data, league) {
  const { rosters, users, matchups, transactions, players } = data;
  const playoffTeamCount = league.settings?.playoff_teams || 4;

  const myRoster = rosters.find(r => r.owner_id === _identity.user_id);
  if (!myRoster) return renderError('Could not find your roster in this league.');

  const myMatchup = matchups.find(m => m.roster_id === myRoster.roster_id);
  const oppMatchup = myMatchup
    ? matchups.find(m => m.matchup_id === myMatchup.matchup_id && m.roster_id !== myRoster.roster_id)
    : null;

  const userMap = {};
  (users || []).forEach(u => { userMap[u.user_id] = u; });

  const oppRoster = oppMatchup ? rosters.find(r => r.roster_id === oppMatchup.roster_id) : null;
  const myUser = userMap[_identity.user_id];
  const oppUser = oppRoster ? userMap[oppRoster.owner_id] : null;

  const week = _nflState.display_week || _nflState.week || 1;

  let html = '';
  html += renderSectionHeader('⚔️', `Week ${week} Matchup`);
  html += renderMatchup(myMatchup, oppMatchup, myRoster, oppRoster, myUser, oppUser, players);

  html += renderSectionHeader('📊', 'Standings');
  html += renderStandings(rosters, users, playoffTeamCount);

  if (transactions?.length) {
    html += renderSectionHeader('🔄', 'Recent Transactions');
    html += renderTransactions(transactions, users, players);
  }

  return html;
}

function renderOffSeason(data, league) {
  const { rosters, users, bracket, drafts, picks } = data;
  const playoffTeamCount = league.settings?.playoff_teams || 4;

  let html = '';
  html += renderSectionHeader('📊', 'Final Standings');
  html += renderStandings(rosters, users, playoffTeamCount);

  html += renderSectionHeader('🏆', 'Playoff Bracket');
  html += renderBracket(bracket, rosters, users);

  html += renderSectionHeader('📋', 'Draft');
  html += renderDraftInfo(drafts, picks);

  return html;
}

// ── Init ──
Dissent.init({ onFallback: () => {} }).then(async () => {
  _identity = await storageGet('sleeper:identity');
  if (!_identity?.user_id) { showSetupScreen(); return; }
  await loadMain();
}).catch(console.error);
</script>
</body>
</html>
