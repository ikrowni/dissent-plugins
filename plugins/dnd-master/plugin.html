<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>LanternKeep DM</title>
  <link rel="stylesheet" href="lanternkeep-theme.css">
  <link rel="stylesheet" href="dnd-master-styles.css?v=20261014g">
</head>
<body>
  <div class="center" id="loading"><div class="spinner"></div></div>
  <div class="center hidden" id="not-dm">
    <div style="font-size:14px;font-weight:700">Dungeon Master Only</div>
    <div style="font-size:12px;color:var(--muted);max-width:220px;line-height:1.5">
      This sidebar is only available to the Dungeon Master of an active campaign.
    </div>
  </div>
  <div id="dm-app" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <div class="dm-head">
      <span class="lk-title dm-head-title">Dungeon Master</span>
      <span id="dm-campaign-name" class="dm-head-camp"></span>
      <button id="dm-rolls-btn" class="dm-gear" onclick="toggleShownRolls()" title="Your rolls: secret (players only hear the dice)" aria-pressed="false" aria-label="Players see my rolls"></button>
      <button id="dm-settings-btn" class="dm-gear" onclick="switchDMTab('settings')" title="Table rules" aria-label="Table rules"></button>
    </div>
    <nav id="section-bar" aria-label="DM sections"></nav>
    <nav id="subtab-bar" aria-label="Tools"></nav>
    <div id="session-bar" class="hidden" style="display:flex;gap:6px;align-items:center;padding:6px 10px 0"></div>
    <div id="party-panel" class="hidden" style="padding:6px 10px;border-bottom:1px solid var(--border);max-height:40%;overflow-y:auto"></div>
    <div id="tab-content">
      <div id="tab-encounter"></div>
      <div id="tab-initiative" class="hidden"></div>
      <div id="tab-monsters"   class="hidden"></div>
      <div id="tab-maps"       class="hidden"></div>
      <div id="tab-actors"     class="hidden"></div>
      <div id="tab-items"      class="hidden"></div>
      <div id="tab-shops"      class="hidden"></div>
      <div id="tab-taverns"    class="hidden"></div>
      <div id="tab-games"      class="hidden"></div>
      <div id="tab-scenes"     class="hidden"></div>
      <div id="tab-journals"   class="hidden"></div>
      <div id="tab-sounds"     class="hidden"></div>
      <div id="tab-triggers"   class="hidden"></div>
      <div id="tab-notes"      class="hidden"></div>
      <div id="tab-homebrew"   class="hidden"></div>
      <div id="tab-logs"       class="hidden"></div>
      <div id="tab-settings"   class="hidden"></div>
      <div id="tab-players"  class="hidden" style="display:flex;flex-direction:column;overflow:hidden;flex:1"></div>
    </div>
  </div>
  <script type="module" src="dnd-master-main.js?v=20261014g"></script>
</body>
</html>
