<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Poll</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #0a0a12;
    color: rgba(255,255,255,0.85);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: rgba(var(--glow, 108,99,255), 0.2);
    color: rgba(var(--bright, 168,139,250), 1);
    margin-bottom: 12px;
  }
  h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .option {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    transition: border-color 0.2s;
  }
  .option:hover { border-color: rgba(var(--glow, 108,99,255), 0.4); }
  .option.voted { border-color: rgba(var(--glow, 108,99,255), 0.5); }
  .option-bar {
    position: absolute;
    inset: 0;
    background: rgba(var(--glow, 108,99,255), 0.12);
    transform-origin: left;
    transition: transform 0.4s ease;
  }
  .option-content {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
  }
  .label { font-size: 14px; font-weight: 600; }
  .pct { font-size: 12px; color: rgba(255,255,255,0.45); }
  .voter { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">Live Poll</div>
  <h2 id="question">Loading poll…</h2>
  <div id="options"></div>
  <p class="voter" id="voter-info">You haven't voted yet.</p>
</div>
<script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
<script>
  // In-memory vote state (resets on reload)
  const votes = {};   // option -> count
  let userVote = null;
  let options = [];
  let userName = null;

  function applyTheme(theme) {
    if (theme['--theme-glow-rgb']) document.documentElement.style.setProperty('--glow', theme['--theme-glow-rgb']);
    if (theme['--theme-bright-rgb']) document.documentElement.style.setProperty('--bright', theme['--theme-bright-rgb']);
  }

  function totalVotes() { return Object.values(votes).reduce((s, v) => s + v, 0); }

  function render() {
    const total = totalVotes();
    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = options.map(opt => {
      const count = votes[opt] || 0;
      const pct = total > 0 ? Math.round(count / total * 100) : 0;
      const isVoted = userVote === opt;
      return `
        <div class="option${isVoted ? ' voted' : ''}" data-opt="${opt}" onclick="vote('${opt}')">
          <div class="option-bar" style="transform: scaleX(${pct / 100})"></div>
          <div class="option-content">
            <span class="label">${opt}</span>
            <span class="pct">${pct}% (${count})</span>
          </div>
        </div>
      `;
    }).join('');

    const voterEl = document.getElementById('voter-info');
    if (userVote) {
      voterEl.textContent = `${userName ? userName + ' voted' : 'You voted'}: ${userVote} · ${total} total vote${total !== 1 ? 's' : ''}`;
    } else {
      voterEl.textContent = `${total} vote${total !== 1 ? 's' : ''} · Click an option to vote.`;
    }
  }

  window.vote = function(opt) {
    if (userVote === opt) return;
    if (userVote) votes[userVote] = Math.max(0, (votes[userVote] || 0) - 1);
    userVote = opt;
    votes[opt] = (votes[opt] || 0) + 1;
    render();
  };

  async function main() {
    const ctx = await Dissent.init({ onFallback: () => console.warn('Running outside Dissent') });
    applyTheme(ctx.theme || {});
    const config = ctx.config || {};
    document.getElementById('question').textContent = config.question || 'What do you think?';
    options = config.options || ['Yes', 'No', 'Maybe'];
    options.forEach(o => { votes[o] = 0; });
    userName = ctx.user?.displayName || null;
    render();

    Dissent.on('theme-update', (theme) => applyTheme(theme || {}));
  }

  main().catch(err => console.error(err));
</script>
</body>
</html>
