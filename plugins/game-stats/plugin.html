<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #07070d;
    color: white;
    padding: 10px 14px;
    overflow: hidden;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-value {
    font-size: 16px;
    font-weight: 700;
    color: rgba(var(--theme-bright-rgb, 168,139,250), 0.9);
  }
  .stat-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: rgba(255,255,255,0.35);
    margin-top: 2px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .platform-badge {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 7px;
    border-radius: 99px;
    background: rgba(var(--theme-glow-rgb, 108,99,255), 0.18);
    color: rgba(var(--theme-bright-rgb, 168,139,250), 0.8);
    border: 1px solid rgba(var(--theme-glow-rgb, 108,99,255), 0.25);
  }
  .username {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div id="root"><div style="color:rgba(255,255,255,0.25);font-size:12px;padding:8px">Loading…</div></div>
<script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
<script>
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function applyTheme(vars) {
    for (const [k, v] of Object.entries(vars)) {
      document.documentElement.style.setProperty(k, v);
    }
  }

  function renderStats(platform, username, stats) {
    const root = document.getElementById('root');
    const items = stats.map(s => `
      <div class="stat">
        <div class="stat-value">${escapeHtml(String(s.value))}</div>
        <div class="stat-label">${escapeHtml(s.label)}</div>
      </div>
    `).join('');
    root.innerHTML = `
      <div class="header">
        <span class="platform-badge">${escapeHtml(platform)}</span>
        <span class="username">${escapeHtml(username)}</span>
      </div>
      <div class="grid">${items}</div>
    `;
  }

  function showPlaceholder(platform, username) {
    // Demo stats — real implementation would call platform APIs
    const demos = {
      chess: [
        { label: 'Rapid', value: '1842' },
        { label: 'Blitz', value: '1594' },
        { label: 'Win %', value: '61%' },
      ],
      rocketleague: [
        { label: 'Rank', value: 'D3' },
        { label: 'MMR', value: '873' },
        { label: 'Goals', value: '1.4' },
      ],
      steam: [
        { label: 'Hours', value: '2.4k' },
        { label: 'Games', value: '187' },
        { label: 'Achvs', value: '324' },
      ],
    };
    const stats = demos[platform?.toLowerCase()] ?? [
      { label: 'Set', value: '–' },
      { label: 'platform', value: '–' },
      { label: 'in cfg', value: '–' },
    ];
    renderStats(escapeHtml(platform ?? 'Game'), escapeHtml(username ?? 'Username'), stats);
  }

  async function main() {
    const ctx = await Dissent.init({ onFallback: () => console.warn('Running outside Dissent') });
    if (ctx.theme) applyTheme(ctx.theme);
    const cfg = ctx.config ?? {};
    showPlaceholder(cfg.platform, cfg.username);

    Dissent.on('theme-update', (theme) => { if (theme) applyTheme(theme); });
  }

  main().catch(err => console.error(err));
</script>
</body>
</html>
