<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #07070d;
    color: white;
    padding: 8px;
    overflow: hidden;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }
  .clip {
    aspect-ratio: 1;
    border-radius: 7px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: rgba(255,255,255,0.25);
  }
  .clip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .label {
    font-size: 10px;
    color: rgba(255,255,255,0.30);
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div id="root">
  <div class="grid">
    <div class="clip">🎬</div>
    <div class="clip">🖼</div>
    <div class="clip">📸</div>
    <div class="clip">🎥</div>
  </div>
  <p class="label">My Clips — loading…</p>
</div>
<script src="/sdk/v1/dissent-plugin-sdk.iife.js"></script>
<script>
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function applyTheme(vars) {
    for (const [k, v] of Object.entries(vars)) {
      document.documentElement.style.setProperty(k, v);
    }
  }

  function render(clips) {
    const root = document.getElementById('root');
    if (!clips || clips.length === 0) {
      root.innerHTML = `
        <div class="grid">
          ${Array(4).fill('<div class="clip">📭</div>').join('')}
        </div>
        <p class="label">No clips shared yet</p>
      `;
      return;
    }
    const items = clips.slice(0, 4).map(clip =>
      clip.url
        ? `<div class="clip"><img src="${escapeHtml(clip.url)}" alt="" loading="lazy"></div>`
        : `<div class="clip">🎬</div>`
    ).join('');
    root.innerHTML = `
      <div class="grid">${items}</div>
      <p class="label">My Clips · ${clips.length} shared</p>
    `;
  }

  async function main() {
    const ctx = await Dissent.init({ onFallback: () => console.warn('Running outside Dissent') });
    if (ctx.theme) applyTheme(ctx.theme);
    // My Clips is Tier 1 passive — the plugin receives no auth token.
    // It displays a placeholder; real implementation would use a public channel gallery endpoint.
    render([]);

    Dissent.on('theme-update', (theme) => { if (theme) applyTheme(theme); });
  }

  main().catch(err => console.error(err));
</script>
</body>
</html>
